    /**
     * api.js — thin client for the Medical RAG Assistant backend.
     */

    const REQUEST_TIMEOUT_MS = 45000;

    class ApiError extends Error {
      constructor(message, status) {
        super(message);
        this.name = "ApiError";
        this.status = status || null;
      }
    }

    async function withTimeout(promiseFactory, ms) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), ms);
      try {
        return await promiseFactory(controller.signal);
      } finally {
        clearTimeout(timer);
      }
    }

    const Api = {
      async sendMessage(message, chatHistory) {
        let res;
        try {
          res = await withTimeout(
            (signal) =>
              fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message, chat_history: chatHistory || [] }),
                signal,
              }),
            REQUEST_TIMEOUT_MS
          );
        } catch (err) {
          if (err.name === "AbortError") throw new ApiError("timeout");
          throw new ApiError("network");
        }
        if (!res.ok) {
          let detail = null;
          try { const body = await res.json(); detail = body.detail; } catch (_) { }
          throw new ApiError(detail || "server_error", res.status);
        }
        return res.json();
      },

      async getSystemInfo() {
        try {
          const res = await withTimeout((signal) => fetch("/api/system-info", { signal }), 10000);
          if (!res.ok) throw new ApiError("server_error", res.status);
          return res.json();
        } catch (err) {
          if (err instanceof ApiError) throw err;
          throw new ApiError("network");
        }
      },

      async analyzeXray(file) {
        const form = new FormData();
        form.append("file", file);
        let res;
        try {
          res = await withTimeout((signal) => fetch("/api/xray", { method: "POST", body: form, signal }), 90000);
        } catch (err) {
          if (err.name === "AbortError") throw new ApiError("timeout");
          throw new ApiError("network");
        }
        if (!res.ok) {
          let detail = null;
          try { detail = (await res.json()).detail; } catch (_) { }
          throw new ApiError(typeof detail === "string" ? detail : "server_error", res.status);
        }
        return res.json();
      },

      async checkHealth() {
        try {
          const res = await withTimeout((signal) => fetch("/api/health", { signal }), 6000);
          return res.ok;
        } catch (_) {
          return false;
        }
      },
    };

    /* ==========================================================================
       State + persistence
       ========================================================================== */
    const STORAGE_KEY = "medrag_conversations_v1";
    const LANG_KEY = "medrag_lang";
    const THEME_KEY = "medrag_theme";

    function detectDefaultLang() {
      const saved = localStorage.getItem(LANG_KEY);
      if (saved === "ar" || saved === "en") return saved;
      return (navigator.language || "").toLowerCase().startsWith("en") ? "en" : "ar";
    }

    function detectDefaultTheme() {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved === "light" || saved === "dark") return saved;
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    }

    const State = {
      lang: detectDefaultLang(),
      theme: detectDefaultTheme(),
      conversations: [],
      activeId: null,
      sending: false,
    };

    function applyTheme() {
      document.documentElement.setAttribute("data-theme", State.theme);
      localStorage.setItem(THEME_KEY, State.theme);
    }

    function toggleTheme() {
      State.theme = State.theme === "light" ? "dark" : "light";
      applyTheme();
    }

    function t(key) {
      return I18N[State.lang][key];
    }

    function loadConversations() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        State.conversations = raw ? JSON.parse(raw) : [];
      } catch (_) {
        State.conversations = [];
      }
    }

    function persistConversations() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(State.conversations));
    }

    function getActiveConversation() {
      return State.conversations.find((c) => c.id === State.activeId) || null;
    }

    function createConversation(firstMessageText) {
      const conv = {
        id: "c_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
        title: firstMessageText.slice(0, 48) + (firstMessageText.length > 48 ? "…" : ""),
        timestamp: Date.now(),
        messages: [],
      };
      State.conversations.unshift(conv);
      State.activeId = conv.id;
      return conv;
    }

    /* ==========================================================================
       Rendering
       ========================================================================== */
    const el = {
      shell: document.querySelector(".app-shell"),
      sidebar: document.querySelector(".sidebar"),
      scrim: document.querySelector(".sidebar-scrim"),
      historyList: document.querySelector(".history-list"),
      historyLabel: document.querySelector(".history-label"),
      newChatBtn: document.querySelector(".new-chat-btn"),
      langButtons: document.querySelectorAll(".lang-toggle button"),
      aboutLink: document.querySelector(".about-link"),
      statusPill: document.querySelector(".status-pill"),
      statusDot: document.querySelector(".status-dot"),
      statusText: document.querySelector(".status-text"),
      mobileMenuBtn: document.querySelector(".mobile-menu-btn"),
      headerTitle: document.querySelector(".header-title"),
      headerSub: document.querySelector(".header-sub-text"),
      aboutBtnHeader: document.querySelector(".header-about-btn"),
      conversation: document.querySelector(".conversation"),
      composerForm: document.querySelector(".composer"),
      textarea: document.querySelector(".composer textarea"),
      sendBtn: document.querySelector(".send-btn"),
      composerHint: document.querySelector(".composer-hint"),
      composerDisclaimer: document.querySelector(".composer-disclaimer"),
      modalRoot: document.querySelector(".modal-root"),
      toastRoot: document.querySelector(".toast-root"),
      themeToggle: document.querySelector(".theme-toggle"),
      headerThemeBtn: document.querySelector(".header-theme-btn"),
      topnavThemeBtn: document.querySelector(".topnav-theme-btn"),
    };

    function applyLanguage() {
      document.documentElement.lang = State.lang;
      document.documentElement.dir = I18N[State.lang].dir;
      localStorage.setItem(LANG_KEY, State.lang);

      el.langButtons.forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.lang === State.lang);
      });

      document.querySelector(".brand-name").textContent = t("brandName");
      document.querySelector(".brand-sub").textContent = t("brandSub");
      el.newChatBtn.lastElementChild.textContent = t("newChat");
      el.historyLabel.textContent = t("historyLabel");
      el.aboutLink.lastElementChild.textContent = t("aboutProject");
      el.headerTitle.textContent = t("headerTitle");
      el.textarea.placeholder = t("placeholder");
      el.composerHint.textContent = t("composerHint");
      if (el.composerDisclaimer) el.composerDisclaimer.textContent = t("disclaimer");

      updateStatusPill(lastKnownOnline);
      renderHistory();
      renderConversation();
    }

    let lastKnownOnline = true;
    function updateStatusPill(online) {
      lastKnownOnline = online;
      el.statusDot.classList.toggle("ok", online);
      el.statusDot.classList.toggle("down", !online);
      el.statusText.textContent = online ? t("statusOnline") : t("statusOffline");
      el.headerSub.textContent = online ? t("headerSubOnline") : t("headerSubOffline");
    }

    function renderHistory() {
      el.historyList.innerHTML = "";
      if (State.conversations.length === 0) {
        const empty = document.createElement("div");
        empty.className = "history-empty";
        empty.textContent = t("historyEmpty");
        el.historyList.appendChild(empty);
        return;
      }

      State.conversations.forEach((conv) => {
        const item = document.createElement("div");
        item.className = "history-item" + (conv.id === State.activeId ? " active" : "");

        const title = document.createElement("div");
        title.className = "history-item-title";
        title.textContent = conv.title;
        title.addEventListener("click", () => {
          State.activeId = conv.id;
          renderHistory();
          renderConversation();
          closeMobileSidebar();
        });

        const menuBtn = document.createElement("button");
        menuBtn.className = "history-menu-btn";
        menuBtn.setAttribute("aria-label", t("rename"));
        menuBtn.innerHTML = dotsIcon();
        menuBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          openHistoryMenu(item, conv);
        });

        item.appendChild(title);
        item.appendChild(menuBtn);
        el.historyList.appendChild(item);
      });
    }

    function openHistoryMenu(itemEl, conv) {
      // Toggle: clicking the same item's dots again closes the menu
      const existing = document.querySelector(".history-popover");
      const sameItem = existing && existing._itemEl === itemEl;
      document.querySelectorAll(".history-popover").forEach((p) => p._close && p._close());
      if (sameItem) return;

      const pop = document.createElement("div");
      pop.className = "history-popover";
      pop.setAttribute("role", "menu");
      pop._itemEl = itemEl;

      function close() {
        pop.remove();
        itemEl.classList.remove("menu-open");
        document.removeEventListener("click", onDocClick, true);
        document.removeEventListener("keydown", onKey);
        window.removeEventListener("resize", close);
        el.historyList.removeEventListener("scroll", close);
      }
      pop._close = close;
      function onDocClick(e) {
        const dots = itemEl.querySelector(".history-menu-btn");
        if (dots && dots.contains(e.target)) return; // let the dots button toggle it
        if (!pop.contains(e.target)) close();
      }
      function onKey(e) { if (e.key === "Escape") close(); }

      const renameBtn = document.createElement("button");
      renameBtn.type = "button";
      renameBtn.setAttribute("role", "menuitem");
      renameBtn.textContent = t("rename");
      renameBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        close();
        const newTitle = prompt(t("rename") + ":", conv.title);
        if (newTitle && newTitle.trim()) {
          conv.title = newTitle.trim().slice(0, 60);
          persistConversations();
          renderHistory();
        }
      });

      const deleteBtn = document.createElement("button");
      deleteBtn.type = "button";
      deleteBtn.setAttribute("role", "menuitem");
      deleteBtn.className = "danger";
      deleteBtn.textContent = t("deleteChat");
      deleteBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        close();
        State.conversations = State.conversations.filter((c) => c.id !== conv.id);
        if (State.activeId === conv.id) State.activeId = null;
        persistConversations();
        renderHistory();
        renderConversation();
      });

      pop.appendChild(renameBtn);
      pop.appendChild(deleteBtn);

      // Mount on <body> (not inside the item / scrolling list) so nothing can clip or cover it
      document.body.appendChild(pop);
      itemEl.classList.add("menu-open");

      // Position next to the dots button, flip upward / clamp if it would leave the viewport
      const btn = itemEl.querySelector(".history-menu-btn") || itemEl;
      const r = btn.getBoundingClientRect();
      const pw = pop.offsetWidth, ph = pop.offsetHeight;
      const rtl = document.documentElement.dir === "rtl";
      let left = rtl ? r.left : r.right - pw;
      let top = r.bottom + 6;
      if (top + ph > window.innerHeight - 8) top = Math.max(8, r.top - ph - 6);
      left = Math.min(Math.max(8, left), window.innerWidth - pw - 8);
      pop.style.left = left + "px";
      pop.style.top = top + "px";

      setTimeout(() => {
        document.addEventListener("click", onDocClick, true);
        document.addEventListener("keydown", onKey);
        window.addEventListener("resize", close);
        el.historyList.addEventListener("scroll", close, { passive: true });
      }, 0);
      renameBtn.focus();
    }

    function renderConversation() {
      const conv = getActiveConversation();
      el.conversation.innerHTML = "";

      if (!conv || conv.messages.length === 0) {
        el.conversation.appendChild(buildWelcome());
        return;
      }

      const inner = document.createElement("div");
      inner.className = "conversation-inner";
      conv.messages.forEach((msg, idx) => inner.appendChild(buildMessageRow(msg, idx, conv)));
      el.conversation.appendChild(inner);
      el.conversation.scrollTop = el.conversation.scrollHeight;
    }

    function buildWelcome() {
      const wrap = document.createElement("div");
      wrap.className = "welcome";
      wrap.innerHTML = `
    <div class="welcome-glyph"></div>
    <h1>${t("welcomeTitle")}</h1>
    <p>${t("welcomeLead")}</p>
    <p>${t("welcomeSub")}</p>
    <div class="welcome-legend">
      <span><span class="legend-dot turquoise"></span>${t("legendOfficial")}</span>
      <span><span class="legend-dot amber"></span>${t("legendGeneral")}</span>
    </div>
    <div class="example-grid"></div>
    <div class="welcome-disclaimer">${t("disclaimer")}</div>
  `;
      const grid = wrap.querySelector(".example-grid");
      t("examples").forEach((ex) => {
        const card = document.createElement("button");
        card.className = "example-card";
        card.type = "button";
        card.textContent = ex;
        card.addEventListener("click", () => {
          el.textarea.value = ex;
          handleSend();
        });
        grid.appendChild(card);
      });
      return wrap;
    }

    function routeLabel(source) {
      if (source === "guidelines") return t("routeGuidelines");
      if (source === "arabic") return t("routeArabic");
      return t("routeBoth");
    }

    function isOfficialSource(src) {
      return Boolean(src.authority_family || src.authority || src.source_type === "guidelines");
    }

    function sourceDisplayName(src) {
      return (
        src.document_name || src.title || src.book_name || src.book ||
        src.source_name || src.name || src.authority_family || src.authority ||
        src.document_id || null
      );
    }
    function sourceUrl(src) {
      const candidate = src.document_link || src.url || src.source_url || src.link || src.pdf_url || null;
      if (!candidate || typeof candidate !== "string") return null;
      if (/^https?:\/\//i.test(candidate) || candidate.startsWith("/")) return candidate;
      return null;
    }
    function sourcePreview(src) {
      const text = src.text || src.content || src.chunk_text || src.preview || src.snippet || null;
      if (!text || typeof text !== "string") return null;
      return text.length > 320 ? text.slice(0, 320).trim() + "…" : text;
    }
    function sourceChunkId(src) {
      return src.chunk_id || src.chunkId || (src.id && String(src.id).length < 40 ? src.id : null) || null;
    }
    function sourceSub(src) {
      const official = isOfficialSource(src);
      const parts = [];
      if (official) {
        if (src.category) parts.push(src.category);
      } else {
        parts.push(src.category || t("generalConsult"));
      }
      if (src.start_page) {
        parts.push(
          src.end_page && src.end_page !== src.start_page
            ? `${t("detailPage")} ${src.start_page}–${src.end_page}`
            : `${t("detailPage")} ${src.start_page}`
        );
      }
      return parts.join(" · ");
    }

    function buildSourceCard(src) {
      const official = isOfficialSource(src);
      const card = document.createElement("div");
      card.className = "source-card " + (official ? "official" : "general");

      const head = document.createElement("button");
      head.type = "button";
      head.className = "source-card-head";
      head.setAttribute("aria-expanded", "false");

      const icon = document.createElement("div");
      icon.className = "source-card-icon";
      icon.textContent = official ? "📖" : "📄";
      icon.setAttribute("aria-hidden", "true");

      const titles = document.createElement("div");
      titles.className = "source-card-titles";
      const nameEl = document.createElement("div");
      nameEl.className = "source-card-name";
      nameEl.textContent = sourceDisplayName(src) || (official ? t("routeGuidelines") : t("generalConsult"));
      const subEl = document.createElement("div");
      subEl.className = "source-card-sub";
      subEl.textContent = sourceSub(src);
      titles.appendChild(nameEl);
      if (subEl.textContent) titles.appendChild(subEl);

      head.appendChild(icon);
      head.appendChild(titles);

      if (typeof src.score === "number") {
        const scoreEl = document.createElement("div");
        scoreEl.className = "source-card-score";
        scoreEl.textContent = src.score.toFixed(3);
        head.appendChild(scoreEl);

      metaGrid.className = "source-meta-grid";

      if (chunkId) metaGrid.appendChild(buildMetaItem(t("detailDoc"), chunkId));
      if (src.category && official) metaGrid.appendChild(buildMetaItem(t("detailCategory"), src.category));
      if (metaGrid.children.length) body.appendChild(metaGrid);

      const url = sourceUrl(src);
      if (url) {
        const link = document.createElement("a");
        link.className = "source-link";

    function buildMetaItem(label, value) {
      const item = document.createElement("div");
      item.className = "source-meta-item";
      const l = document.createElement("span");

      const v = document.createElement("b");

      item.appendChild(l);
      item.appendChild(v);

    /* ==========================================================================
       Answer rendering (lightweight Markdown-ish -> DOM)
       ========================================================================== */
    function escapeHtml(str) {
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function inlineFormat(str) {
      let s = escapeHtml(str);
      s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");
      return s;
    }

    function buildRichText(rawText) {
      const wrap = document.createElement("div");
      wrap.className = "rich-text";
      const lines = String(rawText || "").replace(/\r\n/g, "\n").split("\n");

      let currentList = null;
      let paragraphBuf = [];

      const flushParagraph = () => {
        if (paragraphBuf.length) {
          const p = document.createElement("p");
          p.dir = "auto";
          p.innerHTML = paragraphBuf.map(inlineFormat).join("<br>");
          wrap.appendChild(p);
          paragraphBuf = [];
        }
      };

      for (const line of lines) {
        const trimmed = line.trim();
        if (trimmed === "") { flushParagraph(); currentList = null; continue; }

        const headingMatch = trimmed.match(/^(#{1,4})\s+(.*)$/);
        if (headingMatch) {
          flushParagraph(); currentList = null;
          const h = document.createElement("h" + Math.min(headingMatch[1].length, 4));
          h.dir = "auto";
          h.innerHTML = inlineFormat(headingMatch[2]);
          wrap.appendChild(h);
          continue;
        }

        const boldHeadingMatch = trimmed.match(/^\*\*([^*]{1,80})\*\*:?$/);
        if (boldHeadingMatch) {
          flushParagraph(); currentList = null;
          const h = document.createElement("h4");
          h.dir = "auto";
          h.textContent = boldHeadingMatch[1];
          wrap.appendChild(h);
          continue;
        }

        const ulMatch = trimmed.match(/^[-•]\s+(.*)$/);
        const olMatch = trimmed.match(/^(\d+)[.)]\s+(.*)$/);

        if (ulMatch) {
          flushParagraph();
          if (!currentList || currentList.type !== "ul") {
            const ul = document.createElement("ul");
            wrap.appendChild(ul);
            currentList = { type: "ul", el: ul };
          }
          const li = document.createElement("li");
          li.dir = "auto";
          li.innerHTML = inlineFormat(ulMatch[1]);
          currentList.el.appendChild(li);
          continue;
        }

        if (olMatch) {
          flushParagraph();
          if (!currentList || currentList.type !== "ol") {
            const ol = document.createElement("ol");
            wrap.appendChild(ol);
            currentList = { type: "ol", el: ol };
          }
          const li = document.createElement("li");
          li.dir = "auto";
          li.innerHTML = inlineFormat(olMatch[2]);
          currentList.el.appendChild(li);
          continue;
        }

        currentList = null;
        paragraphBuf.push(line);
      }
      flushParagraph();

      if (!wrap.children.length) {
        const p = document.createElement("p");
        p.dir = "auto";
        p.textContent = rawText;
        wrap.appendChild(p);
      }
      return wrap;
    }

    function buildMessageRow(msg, idx, conv) {
      const row = document.createElement("div");
      row.className = "msg-row " + msg.role;

      const avatar = document.createElement("div");
      avatar.className = "avatar " + msg.role;
      avatar.innerHTML = msg.role === "user" ? userIcon() : botIcon();

      const col = document.createElement("div");
      col.className = "msg-col";

      if (msg.role === "assistant" && msg.routing) {
        const meta = document.createElement("div");
        meta.className = "msg-meta";
        const glyph = document.createElement("span");
        glyph.className = "route-glyph " + msg.routing.source;
        meta.appendChild(glyph);
        const label = document.createElement("span");
        label.textContent = routeLabel(msg.routing.source);
        meta.appendChild(label);

        if (typeof msg.trustScore === "number") {
          const trustLevel = msg.trustLabel || "medium";
          const trust = document.createElement("span");
          trust.className = "trust-badge " + trustLevel;
          trust.textContent =
            t("trustLabel") + ": " + t("trust_" + trustLevel) +
            " (" + Math.round(msg.trustScore * 100) + "%)";
          meta.appendChild(trust);
        }

        col.appendChild(meta);
      }

      const bubble = document.createElement("div");
      bubble.className = "bubble " + (msg.role === "user" ? "user" : msg.isError ? "assistant error" : "assistant");
      if (msg.role === "assistant" && !msg.isError) {
        bubble.style.whiteSpace = "normal";
        bubble.appendChild(buildRichText(msg.content));
      } else {
        bubble.textContent = msg.content;
      }
      col.appendChild(bubble);

      if (msg.isError) {
        const retryBtn = document.createElement("button");
        retryBtn.className = "example-card";
        retryBtn.style.width = "fit-content";
        retryBtn.textContent = t("retry");
        retryBtn.addEventListener("click", () => retryFromError(idx, conv));
        col.appendChild(retryBtn);
      }

      if (msg.role === "assistant" && !msg.isError) {
        const actions = document.createElement("div");
        actions.className = "msg-actions";

        const copyBtn = iconButton(copyIcon(), t("copy"));
        copyBtn.addEventListener("click", async () => {
          await copyToClipboard(msg.content);
          copyBtn.classList.add("copied");
          setTimeout(() => copyBtn.classList.remove("copied"), 320);
        });

        const regenBtn = iconButton(regenIcon(), t("regenerate"));
        regenBtn.addEventListener("click", () => regenerate(idx, conv));

        const likeBtn = iconButton(likeIcon(), t("like"));
        likeBtn.classList.toggle("active", msg.feedback === "like");
        likeBtn.setAttribute("aria-pressed", String(msg.feedback === "like"));
        likeBtn.addEventListener("click", () => setFeedback(conv, idx, "like", likeBtn, dislikeBtn));

        const dislikeBtn = iconButton(dislikeIcon(), t("dislike"), "dislike");
        dislikeBtn.classList.toggle("active", msg.feedback === "dislike");
        dislikeBtn.setAttribute("aria-pressed", String(msg.feedback === "dislike"));
        dislikeBtn.addEventListener("click", () => setFeedback(conv, idx, "dislike", likeBtn, dislikeBtn));

        actions.appendChild(copyBtn);
        actions.appendChild(regenBtn);
        actions.appendChild(likeBtn);
        actions.appendChild(dislikeBtn);
        col.appendChild(actions);

        if (msg.sources && msg.sources.length > 0) {
          const toggleBtn = document.createElement("button");
          toggleBtn.type = "button";
          toggleBtn.className = "sources-toggle";
          toggleBtn.setAttribute("aria-expanded", "false");
          toggleBtn.innerHTML =
            `<span class="chevron">${chevronIcon()}</span>` +
            `<span class="label-text">${t("sourcesShow")}</span>` +
            `<span class="count-badge">(${msg.sources.length})</span>`;

          const panel = document.createElement("div");
          panel.className = "sources-panel";
          msg.sources.forEach((src) => panel.appendChild(buildSourceCard(src)));

          let shown = false;
          toggleBtn.addEventListener("click", () => {
            shown = !shown;
            panel.classList.toggle("expanded", shown);
            toggleBtn.setAttribute("aria-expanded", String(shown));
            toggleBtn.querySelector(".label-text").textContent = shown ? t("sourcesHide") : t("sourcesShow");
          });

          col.appendChild(toggleBtn);
          col.appendChild(panel);
        }
      }

      row.appendChild(avatar);
      row.appendChild(col);
      return row;
    }

    function setFeedback(conv, idx, value, likeBtn, dislikeBtn) {
      const msg = conv.messages[idx];
      msg.feedback = msg.feedback === value ? null : value;
      persistConversations();
      likeBtn.classList.toggle("active", msg.feedback === "like");
      likeBtn.setAttribute("aria-pressed", String(msg.feedback === "like"));
      dislikeBtn.classList.toggle("active", msg.feedback === "dislike");
      dislikeBtn.setAttribute("aria-pressed", String(msg.feedback === "dislike"));
    }

    function iconButton(svg, label, extraClass) {
      const btn = document.createElement("button");
      btn.className = "msg-action-btn" + (extraClass ? " " + extraClass : "");
      btn.setAttribute("aria-label", label);
      btn.title = label;
      btn.innerHTML = svg;
      return btn;
    }

    /* ==========================================================================
       Chat flow
       ========================================================================== */
    function buildBackendHistory(conv) {
      return conv.messages
        .filter((m) => !m.isError)
        .map((m) => ({ role: m.role, content: m.content }));
    }

    async function handleSend() {
      const text = el.textarea.value.trim();
      if (!text || State.sending) return;

      let conv = getActiveConversation();
      if (!conv) conv = createConversation(text);

      conv.messages.push({ role: "user", content: text });
      el.textarea.value = "";
      autoResizeTextarea();
      persistConversations();
      renderHistory();
      renderConversation();

      await sendAndAppendAnswer(conv);
    }

    async function sendAndAppendAnswer(conv) {
      State.sending = true;
      el.sendBtn.disabled = true;

      const thinkingEl = appendThinkingRow();
      const historyForBackend = buildBackendHistory(conv).slice(0, -1);

      try {
        const lastUserMsg = conv.messages[conv.messages.length - 1].content;
        const result = await Api.sendMessage(lastUserMsg, historyForBackend);

        thinkingEl.remove();
        conv.messages.push({
          role: "assistant",
          content: result.answer,
          sources: result.sources || [],
          routing: result.routing || null,
          trustScore: typeof result.trust_score === "number" ? result.trust_score : null,
          trustLabel: result.trust_label || null,
        });
        trackAnswer(result.routing ? result.routing.source : null, State.lang);
        updateStatusPill(true);
      } catch (err) {
        thinkingEl.remove();
        updateStatusPill(err.status !== undefined ? true : false);
        const message =
          err.message === "timeout"
            ? t("errorTimeout")
            : err.message === "network"
              ? t("errorNetwork")
              : t("errorServer");
        conv.messages.push({ role: "assistant", content: message, isError: true });
      }

      persistConversations();
      renderHistory();
      renderConversation();
      State.sending = false;
      el.sendBtn.disabled = false;
    }

    function appendThinkingRow() {
      const inner = el.conversation.querySelector(".conversation-inner") || (() => {
        const i = document.createElement("div");
        i.className = "conversation-inner";
        el.conversation.appendChild(i);
        return i;
      })();

      const row = document.createElement("div");
      row.className = "msg-row thinking-row";
      row.innerHTML = `
    <div class="avatar assistant">${botIcon()}</div>
    <div class="thinking-bubble">
      <span class="thinking-text">${t("thinking1")}</span>
      <span class="dot-flow"><span></span><span></span><span></span></span>
    </div>
  `;
      inner.appendChild(row);
      el.conversation.scrollTop = el.conversation.scrollHeight;

      const textEl = row.querySelector(".thinking-text");
      const swapTimer = setTimeout(() => {
        if (textEl) textEl.textContent = t("thinking2");
      }, 1300);
      row.dataset.timer = swapTimer;

      const originalRemove = row.remove.bind(row);
      row.remove = () => {
        clearTimeout(swapTimer);
        originalRemove();
      };
      return row;
    }

    function retryFromError(idx, conv) {
      conv.messages.splice(idx, 1);
      persistConversations();
      renderConversation();
      sendAndAppendAnswer(conv);
    }

    function regenerate(idx, conv) {
      let userIdx = idx - 1;
      while (userIdx >= 0 && conv.messages[userIdx].role !== "user") userIdx--;
      if (userIdx < 0) return;

      conv.messages = conv.messages.slice(0, idx);
      persistConversations();
      renderConversation();
      sendAndAppendAnswer(conv);
    }

    async function copyToClipboard(text) {
      try {
        await navigator.clipboard.writeText(text);
        showToast(t("copied"));
      } catch (_) {
        showToast(t("copied"));
      }
    }

    function showToast(message) {
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;
      el.toastRoot.appendChild(toast);
      setTimeout(() => toast.remove(), 1800);
    }

    /* ==========================================================================
       Dashboard
       ========================================================================== */
    const STATS_KEY = "medrag_stats_v1";

    function loadStats() {
      const empty = { routeCounts: { guidelines: 0, arabic: 0, both: 0 }, langCounts: { ar: 0, en: 0 }, lastActive: null };
      try {
        const raw = localStorage.getItem(STATS_KEY);
        if (!raw) return empty;
        const parsed = JSON.parse(raw);
        return {
          routeCounts: Object.assign({}, empty.routeCounts, parsed.routeCounts),
          langCounts: Object.assign({}, empty.langCounts, parsed.langCounts),
          lastActive: parsed.lastActive || null,
        };
      } catch (_) {
        return empty;
      }
    }

    function trackAnswer(routeSource, uiLang) {
      const stats = loadStats();
      stats.lastActive = new Date().toISOString();
      if (routeSource && stats.routeCounts[routeSource] !== undefined) stats.routeCounts[routeSource]++;
      if (uiLang && stats.langCounts[uiLang] !== undefined) stats.langCounts[uiLang]++;
      localStorage.setItem(STATS_KEY, JSON.stringify(stats));
    }

    function setBar(fillId, labelId, labelText, value, max, variant) {
      const fillEl = document.getElementById(fillId);
      const labelEl = document.getElementById(labelId);
      if (labelEl) labelEl.textContent = `${labelText} (${value})`;
      if (fillEl) {
        fillEl.style.width = Math.round((value / max) * 100) + "%";
        fillEl.classList.toggle("amber", Boolean(variant));
        fillEl.style.animation = "none";
        void fillEl.offsetWidth;
        fillEl.style.animation = "";
      }
    }

    /* ==========================================================================
       X-ray
       ========================================================================== */
    const XRAY_MAX_BYTES = 10 * 1024 * 1024;
    const XRAY_TYPES = ["image/png", "image/jpeg"];
    let xrayFile = null;
    let xrayPreviewUrl = null;
    let xrayBusy = false;
    let xrayOutcome = null;

    function xrayEls() {
      return {
        drop: document.getElementById("xr-drop"),
        input: document.getElementById("xr-file"),
        preview: document.getElementById("xr-preview"),
        dropText: document.getElementById("xr-drop-text"),
        analyze: document.getElementById("xr-analyze"),
      };
    }

    function renderXrayTexts() {
      setText("nav-label-xray", t("navXray"));
      setText("xr-title", t("xrTitle"));
      setText("xr-sub", t("xrSub"));
      setText("xr-disclaimer", t("xrDisclaimer"));
      const x = xrayEls();
      if (!x.drop) return;
      x.dropText.textContent = xrayFile ? xrayFile.name + " — " + t("xrChange") : t("xrDropIdle");
      x.analyze.textContent = xrayBusy ? t("xrAnalyzing") : t("xrAnalyze");
      x.drop.classList.toggle("scanning", !!xrayBusy);
      renderXrayOutcome();
    }

    function renderXrayOutcome() {
      const box = document.getElementById("xr-result");
      if (!box) return;
      box.innerHTML = "";
      box.className = "xr-result";
      if (!xrayOutcome) { box.hidden = true; return; }
      box.hidden = false;

      if (!xrayOutcome.result) {
        box.classList.add("error");
        box.textContent = xrayOutcome.errorText || t(xrayOutcome.errorKey);
        return;
      }

      const r = xrayOutcome.result;
      const isPn = r.label === "PNEUMONIA";
      box.classList.add(isPn ? "pneumonia" : "normal");
      const pct = Math.round(r.pneumonia_probability * 1000) / 10;
      const thr = Math.round(r.threshold * 1000) / 10;

      const label = document.createElement("div");
      label.className = "xr-label";
      label.textContent = isPn ? t("xrPneumonia") : t("xrNormal");

      const meter = document.createElement("div");
      meter.className = "xr-meter";
      meter.innerHTML = '<div class="xr-meter-fill"></div><div class="xr-meter-mark"></div>';
      meter.querySelector(".xr-meter-fill").style.width = pct + "%";
      meter.querySelector(".xr-meter-mark").style.insetInlineStart = thr + "%";

      const stats = document.createElement("div");
      stats.className = "xr-stats";
      stats.textContent = `${t("xrProb")}: ${pct}% · ${t("xrThreshold")}: ${thr}%`;

      box.appendChild(label);
      box.appendChild(meter);
      box.appendChild(stats);
    }

    function setXrayFile(file) {
      if (!file) return;
      if (!XRAY_TYPES.includes(file.type)) { xrayOutcome = { errorKey: "xrBadType" }; renderXrayOutcome(); return; }
      if (file.size > XRAY_MAX_BYTES) { xrayOutcome = { errorKey: "xrTooBig" }; renderXrayOutcome(); return; }
      xrayFile = file;
      if (xrayPreviewUrl) URL.revokeObjectURL(xrayPreviewUrl);
      xrayPreviewUrl = URL.createObjectURL(file);
      const x = xrayEls();
      x.preview.src = xrayPreviewUrl;
      x.preview.hidden = false;
      x.analyze.disabled = false;
      xrayOutcome = null;
      renderXrayTexts();
    }

    async function runXray() {
      if (!xrayFile || xrayBusy) return;
      xrayBusy = true;
      const x = xrayEls();
      x.analyze.disabled = true;
      xrayOutcome = null;
      renderXrayTexts();
      try {
        xrayOutcome = { result: await Api.analyzeXray(xrayFile) };
      } catch (err) {
        if (err.message === "timeout") xrayOutcome = { errorKey: "errorTimeout" };
        else if (err.message === "network") xrayOutcome = { errorKey: "errorNetwork" };
        else if ((err.status === 400 || err.status === 413) && err.message !== "server_error") xrayOutcome = { errorText: err.message };
        else xrayOutcome = { errorKey: "errorServer" };
      }
      xrayBusy = false;
      x.analyze.disabled = !xrayFile;
      renderXrayTexts();
    }

    function initXray() {
      const x = xrayEls();
      if (!x.drop) return;
      x.input.addEventListener("change", () => { setXrayFile(x.input.files[0]); x.input.value = ""; });
      ["dragenter", "dragover"].forEach((ev) =>
        x.drop.addEventListener(ev, (e) => { e.preventDefault(); x.drop.classList.add("drag"); })
      );
      ["dragleave", "drop"].forEach((ev) =>
        x.drop.addEventListener(ev, (e) => { e.preventDefault(); x.drop.classList.remove("drag"); })
      );
      x.drop.addEventListener("drop", (e) => setXrayFile(e.dataTransfer.files[0]));
      x.analyze.addEventListener("click", runXray);
    }

    /* ==========================================================================
   DESIGN PASS v2 — interaction layer (reveal, spotlight, ripple, nav pill, progress)
   ========================================================================== */
    (function () {
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      /* ---- sliding nav pill ---- */
      function initNavPill() {
        const links = document.querySelector(".topnav-links");
        if (!links) return;
        const ind = document.createElement("span");
        ind.className = "nav-ind";
        links.appendChild(ind);
        let lastKey = "";
        function place() {
          const act = links.querySelector("button.active");
          if (!act) return;
          const w = act.offsetWidth, x = act.offsetLeft;
          const key = w + ":" + x;
          if (key === lastKey) return;
          lastKey = key;
          ind.style.width = w + "px";
          ind.style.transform = "translateX(" + x + "px)";
          if (!ind.classList.contains("ready")) ind.classList.add("ready");
        }
        // observe only the buttons themselves (never the indicator) so our own changes cannot re-trigger us
        const mo = new MutationObserver(place);
        links.querySelectorAll("button[data-nav]").forEach((b) => {
          mo.observe(b, { attributes: true, attributeFilter: ["class"], childList: true, characterData: true, subtree: true });
        });
        window.addEventListener("resize", place);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(place);
        place();
        setTimeout(place, 250);
      }

      /* ---- scroll progress, back-to-top, nav shadow ---- */
      function initScrollUI() {
        const bar = document.createElement("div");
        bar.className = "scroll-progress";
        const top = document.createElement("button");
        top.type = "button";
        top.className = "to-top";
        top.setAttribute("aria-label", "Back to top");
        top.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
        document.body.append(bar, top);
        const nav = document.querySelector(".topnav");
        const landing = document.getElementById("view-landing");
        let tick = false;
        function update() {
          tick = false;
          const y = window.scrollY || document.documentElement.scrollTop;
          const max = document.documentElement.scrollHeight - window.innerHeight;
          const onLanding = landing && landing.classList.contains("active");
          if (nav) nav.classList.toggle("scrolled", y > 8);
          bar.style.opacity = onLanding && y > 8 ? "1" : "0";
          bar.style.transform = "scaleX(" + (max > 0 ? Math.min(1, y / max) : 0) + ")";
          top.classList.toggle("show", onLanding && y > 520);
        }
        window.addEventListener("scroll", () => { if (!tick) { tick = true; requestAnimationFrame(update); } }, { passive: true });
        top.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
        const mo2 = new MutationObserver(update);
        document.querySelectorAll("[data-view]").forEach((v) => mo2.observe(v, { attributes: true, attributeFilter: ["class"] }));
        update();
      }

      /* ---- scroll reveal ---- */
      function initReveal() {
        if (reduce || !("IntersectionObserver" in window)) return;
        document.documentElement.classList.add("rv-on");
        const SEL = ".lp-section-head, .lp-stat, .lp-feature-item, .workflow-step, .lang-card, .pipeline-node, .tech-badges > *, .lp-quick-card, .lp-xray-cta, #lp-xray-section .lp-disclaimer";
        const io = new IntersectionObserver((entries) => {
          entries.forEach((en) => {
            if (!en.isIntersecting) return;
            const n = en.target;
            io.unobserve(n);
            n.classList.add("in");
            const done = () => { n.classList.remove("rv", "in"); n.style.removeProperty("--rvd"); };
            n.addEventListener("transitionend", (e) => { if (e.target === n) done(); }, { once: true });
            setTimeout(done, 1600);
          });
        }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });
        function tag() {
          document.querySelectorAll(SEL).forEach((n) => {
            if (n.dataset.rv || n.closest(".lp-hero")) return;
            n.dataset.rv = "1";
            const idx = n.parentElement ? Array.prototype.indexOf.call(n.parentElement.children, n) : 0;
            n.style.setProperty("--rvd", Math.min(idx, 8) * 70 + "ms");
            n.classList.add("rv");
            io.observe(n);
          });
        }
        let queued = false;
        new MutationObserver(() => { if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; tag(); }); } })
          .observe(document.getElementById("view-landing") || document.body, { childList: true, subtree: true });
        tag();
      }

      /* ---- cursor spotlight on cards ---- */
      function initSpotlight() {
        const SEL = ".lp-stat, .lp-feature-item, .lang-card, .example-card, .xr-card, .lp-quick-card";
        document.addEventListener("pointermove", (e) => {
          const c = e.target.closest && e.target.closest(SEL);
          if (!c) return;
          const r = c.getBoundingClientRect();
          c.style.setProperty("--mx", (e.clientX - r.left) + "px");
          c.style.setProperty("--my", (e.clientY - r.top) + "px");
        }, { passive: true });
      }

      /* ---- button ripple ---- */
      function initRipple() {
        if (reduce) return;
        document.addEventListener("pointerdown", (e) => {
          const b = e.target.closest && e.target.closest(".lp-btn, .new-chat-btn, .example-card, .lp-quick-card");
          if (!b || b.disabled) return;
          const r = b.getBoundingClientRect();
          const size = Math.max(r.width, r.height) * 2;
          const s = document.createElement("span");
          s.className = "rip";
          s.style.width = s.style.height = size + "px";
          s.style.left = (e.clientX - r.left - size / 2) + "px";
          s.style.top = (e.clientY - r.top - size / 2) + "px";
          b.appendChild(s);
          setTimeout(() => s.remove(), 650);
        });
      }

      document.addEventListener("DOMContentLoaded", () => {
        initNavPill();
        initScrollUI();
        initReveal();
        initSpotlight();
        initRipple();
      });
    })();

    document.addEventListener("DOMContentLoaded", init);

  </script>
</body>
