<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Medical RAG Assistant</title>
<meta name="description" content="Bilingual medical assistant combining official NICE/FDA guidelines with general Arabic medical Q&A, powered by Retrieval-Augmented Generation." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>
<style>
/* ==========================================================================
   Medical RAG Assistant — Design Tokens
   Dual-accent system: turquoise = official guideline evidence (NICE/FDA),
   amber = general/unofficial consult evidence (Arabic Q&A). The distinction
   is load-bearing, not decorative — see .evidence-chip and .route-glyph.

   Layout uses CSS *logical* properties (inset-inline-start, margin-inline,
   text-align: start/end, etc.) wherever possible, so switching
   <html dir="rtl|ltr"> flips the whole interface without duplicated rules.
   ========================================================================== */

:root {
  /* Color — dark theme (default) */
  --bg: #0E1720;
  --panel: #14212B;
  --panel-raised: #1B2A35;
  --border: rgba(234, 242, 241, 0.08);
  --border-strong: rgba(234, 242, 241, 0.16);
  --text: #EAF2F1;
  --text-dim: #8FA6AB;
  --text-faint: #5E7377;

  --turquoise: #2FB8A6;
  --turquoise-dim: rgba(47, 184, 166, 0.14);
  --turquoise-line: rgba(47, 184, 166, 0.4);
  --turquoise-ink: #0E1720;

  --amber: #E2A54D;
  --amber-dim: rgba(226, 165, 77, 0.14);
  --amber-line: rgba(226, 165, 77, 0.4);

  --danger: #E2664D;
  --danger-dim: rgba(226, 102, 77, 0.14);

  /* Type */
  --font-sans: 'IBM Plex Sans', -apple-system, sans-serif;
  --font-sans-ar: 'IBM Plex Sans Arabic', 'IBM Plex Sans', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;

  /* Layout */
  --sidebar-w: 276px;
  --content-max-w: 860px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --shadow-panel: 0 8px 30px rgba(0, 0, 0, 0.35);

  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --theme-transition: background-color 0.2s var(--ease), border-color 0.2s var(--ease), color 0.2s var(--ease);
}

/* ---- Light theme override ----
   Same token names, light values. Toggled via [data-theme="light"] on <html>.
   Turquoise/amber accents stay identical so the evidence-color language
   (official vs. general) never changes meaning between themes. */
html[data-theme="light"] {
  --bg: #F4F8F7;
  --panel: #FFFFFF;
  --panel-raised: #EAF1F0;
  --border: rgba(14, 23, 32, 0.09);
  --border-strong: rgba(14, 23, 32, 0.16);
  --text: #10201F;
  --text-dim: #52696C;
  --text-faint: #7C9093;

  --turquoise: #1E9484;
  --turquoise-dim: rgba(30, 148, 132, 0.12);
  --turquoise-line: rgba(30, 148, 132, 0.4);
  --turquoise-ink: #FFFFFF;

  --amber: #B87A1F;
  --amber-dim: rgba(184, 122, 31, 0.12);
  --amber-line: rgba(184, 122, 31, 0.4);

  --danger: #C6472F;
  --danger-dim: rgba(198, 71, 47, 0.1);

  --shadow-panel: 0 8px 30px rgba(20, 33, 43, 0.12);
}

html, body { transition: var(--theme-transition); }

/* ==========================================================================
   Reset & base
   ========================================================================== */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  overflow-y: auto;
  overflow-x: hidden;
}
body.app-active { overflow: hidden; }
html[lang="ar"] body { font-family: var(--font-sans-ar); }

button, input, textarea {
  font-family: inherit;
  color: inherit;
}
button {
  cursor: pointer;
  background: none;
  border: none;
}
a { color: inherit; }

:focus-visible {
  outline: 2px solid var(--turquoise);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    transition-duration: 0.001ms !important;
  }
}

/* ==========================================================================
   App shell
   ========================================================================== */
.app-shell {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  height: 100vh;
  height: 100dvh;
  width: 100vw;
}

/* ---- Sidebar ---- */
.sidebar {
  background: var(--panel);
  border-inline-end: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 20px 18px 16px;
}

.brand-mark {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  flex-shrink: 0;
  background: conic-gradient(var(--turquoise) 0deg 180deg, var(--amber) 180deg 360deg);
  box-shadow: 0 0 0 3px var(--panel-raised);
}

.brand-text .brand-name {
  font-weight: 600;
  font-size: 14.5px;
  letter-spacing: 0.01em;
}
.brand-text .brand-sub {
  font-size: 11.5px;
  color: var(--text-dim);
  margin-top: 1px;
}

.new-chat-btn {
  margin: 4px 14px 10px;
  padding: 10px 14px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  background: var(--panel-raised);
  color: var(--text);
  font-size: 13.5px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: border-color 0.15s var(--ease), background 0.15s var(--ease);
}
.new-chat-btn:hover { border-color: var(--turquoise-line); background: #203440; }
.new-chat-btn svg { flex-shrink: 0; }

.history-label {
  padding: 14px 18px 6px;
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--text-faint);
  text-transform: uppercase;
}

.history-list {
  flex: 1;
  overflow-y: auto;
  padding: 0 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.history-item {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 10px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--text-dim);
  transition: background 0.15s var(--ease);
}
.history-item:hover { background: var(--panel-raised); color: var(--text); }
.history-item.active { background: var(--panel-raised); color: var(--text); }
.history-item.active::before {
  content: "";
  position: absolute;
  inset-inline-start: 0;
  top: 20%;
  bottom: 20%;
  width: 2.5px;
  border-radius: 2px;
  background: var(--turquoise);
}
.history-item-title {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  cursor: pointer;
}
.history-item-time {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-faint);
  flex-shrink: 0;
}
.history-menu-btn {
  flex-shrink: 0;
  width: 22px;
  height: 22px;
  display: none;
  align-items: center;
  justify-content: center;
  border-radius: 5px;
  color: var(--text-dim);
}
.history-item:hover .history-menu-btn { display: flex; }
.history-menu-btn:hover { background: rgba(255,255,255,0.08); color: var(--text); }

.history-empty {
  padding: 14px 10px;
  font-size: 12.5px;
  color: var(--text-faint);
  line-height: 1.6;
}

.history-popover {
  position: absolute;
  inset-inline-end: 4px;
  top: 34px;
  z-index: 20;
  background: var(--panel-raised);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-panel);
  min-width: 130px;
  overflow: hidden;
}
.history-popover button {
  display: block;
  width: 100%;
  text-align: start;
  padding: 9px 12px;
  font-size: 12.5px;
  color: var(--text);
}
.history-popover button:hover { background: rgba(255,255,255,0.06); }
.history-popover button.danger { color: var(--danger); }

.sidebar-footer {
  border-top: 1px solid var(--border);
  padding: 12px 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.lang-toggle {
  display: flex;
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  padding: 2px;
  width: fit-content;
}
.lang-toggle button {
  padding: 5px 14px;
  font-size: 12px;
  font-weight: 600;
  border-radius: 999px;
  color: var(--text-dim);
  font-family: var(--font-mono);
}
.lang-toggle button.active {
  background: var(--turquoise-dim);
  color: var(--turquoise);
}

.footer-controls-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.theme-toggle {
  width: 30px;
  height: 30px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  border: 1px solid var(--border-strong);
  color: var(--text-dim);
  transition: border-color 0.15s var(--ease), color 0.15s var(--ease), background 0.15s var(--ease);
}
.theme-toggle:hover { border-color: var(--turquoise-line); color: var(--turquoise); background: var(--turquoise-dim); }
.theme-toggle svg { display: block; }
.theme-toggle .icon-moon,
.header-theme-btn .icon-moon { display: none; }
html[data-theme="light"] .theme-toggle .icon-sun,
html[data-theme="light"] .header-theme-btn .icon-sun { display: none; }
html[data-theme="light"] .theme-toggle .icon-moon,
html[data-theme="light"] .header-theme-btn .icon-moon { display: block; }

.sidebar-link-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.about-link {
  font-size: 12.5px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 6px;
}
.about-link:hover { color: var(--text); }

.status-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text-faint);
  font-family: var(--font-mono);
}
.status-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--text-faint);
}
.status-dot.ok { background: var(--turquoise); box-shadow: 0 0 0 3px var(--turquoise-dim); }
.status-dot.down { background: var(--danger); box-shadow: 0 0 0 3px var(--danger-dim); }

/* Hidden by default on all screen sizes — only ever shown (as a fixed-
   position overlay) while the mobile sidebar drawer is open. Without this
   base rule it's an unstyled block div and becomes a 3rd grid item inside
   .app-shell's 2-column grid, wrapping .main onto a new row underneath
   the sidebar. */
.sidebar-scrim { display: none; }

/* ---- Main column ---- */
.main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  height: 100vh;
  height: 100dvh;
  min-height: 0;
}

.main-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 26px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mobile-menu-btn {
  display: none;
  width: 32px; height: 32px;
  align-items: center; justify-content: center;
  border-radius: var(--radius-sm);
  color: var(--text-dim);
}
.header-title { font-size: 14.5px; font-weight: 600; }
.header-sub {
  font-size: 11.5px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 6px;
}
.ai-pulse {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--turquoise);
  animation: pulse 2.2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}
.header-right { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm);
  color: var(--text-dim);
  border: 1px solid transparent;
}
.icon-btn:hover { background: var(--panel-raised); color: var(--text); border-color: var(--border-strong); }

/* ---- Conversation area ---- */
.conversation {
  flex: 1;
  overflow-y: auto;
  padding: 24px 20px 12px;
}
.conversation-inner {
  max-width: var(--content-max-w);
  width: 100%;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 22px;
}

/* ---- Welcome screen ---- */
.welcome {
  max-width: 640px;
  margin: 4vh auto 0;
  text-align: center;
  padding: 0 16px;
}
.welcome-glyph {
  width: 52px; height: 52px;
  margin: 0 auto 22px;
  border-radius: 50%;
  background: conic-gradient(var(--turquoise) 0deg 180deg, var(--amber) 180deg 360deg);
  box-shadow: 0 0 0 6px var(--panel), 0 12px 30px rgba(47,184,166,0.15);
}
.welcome h1 {
  font-size: 25px;
  font-weight: 600;
  margin: 0 0 10px;
  letter-spacing: -0.01em;
}
.welcome p {
  font-size: 14.5px;
  color: var(--text-dim);
  line-height: 1.7;
  margin: 0 auto 8px;
  max-width: 480px;
}
.welcome-legend {
  display: flex;
  justify-content: center;
  gap: 18px;
  margin: 18px 0 30px;
  font-size: 12px;
  color: var(--text-dim);
}
.welcome-legend span { display: flex; align-items: center; gap: 6px; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }
.legend-dot.turquoise { background: var(--turquoise); }
.legend-dot.amber { background: var(--amber); }

.example-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  text-align: start;
}
.example-card {
  padding: 13px 15px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.55;
  transition: border-color 0.15s var(--ease), transform 0.15s var(--ease), color 0.15s var(--ease);
  text-align: start;
}
.example-card:hover {
  border-color: var(--turquoise-line);
  color: var(--text);
  transform: translateY(-1px);
}

.welcome-disclaimer {
  margin-top: 28px;
  font-size: 11.5px;
  color: var(--text-faint);
  line-height: 1.6;
}

/* ---- Messages ---- */
.msg-row {
  display: flex;
  gap: 12px;
  animation: rise 0.28s var(--ease);
}
@keyframes rise {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg-row.user { flex-direction: row-reverse; }

.avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
  font-weight: 600;
  margin-top: 2px;
}
.avatar.assistant {
  background: var(--panel-raised);
  border: 1px solid var(--border-strong);
}
.avatar.user {
  background: var(--turquoise-dim);
  color: var(--turquoise);
}

.msg-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.msg-row.user .msg-col { align-items: flex-end; }

.route-glyph {
  width: 14px; height: 14px;
  border-radius: 50%;
  flex-shrink: 0;
}
.route-glyph.guidelines { background: var(--turquoise); }
.route-glyph.arabic { background: var(--amber); }
.route-glyph.both { background: conic-gradient(var(--turquoise) 0deg 180deg, var(--amber) 180deg 360deg); }

.trust-badge {
  margin-inline-start: 8px;
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  border: 1px solid transparent;
  white-space: nowrap;
}
.trust-badge.high {
  color: var(--turquoise);
  background: var(--turquoise-dim);
  border-color: var(--turquoise-line);
}
.trust-badge.medium {
  color: var(--amber);
  background: rgba(226, 165, 77, 0.12);
  border-color: rgba(226, 165, 77, 0.35);
}
.trust-badge.low {
  color: #E2645B;
  background: rgba(226, 100, 91, 0.12);
  border-color: rgba(226, 100, 91, 0.35);
}

.msg-meta {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 11px;
  color: var(--text-faint);
  font-family: var(--font-mono);
}

.bubble {
  max-width: 100%;
  padding: 13px 16px;
  border-radius: var(--radius-lg);
  font-size: 14px;
  line-height: 1.75;
  white-space: pre-wrap;
  word-wrap: break-word;
}
.bubble.assistant {
  background: var(--panel);
  border: 1px solid var(--border);
  border-start-start-radius: 4px;
}
.bubble.user {
  background: var(--turquoise-dim);
  border: 1px solid var(--turquoise-line);
  border-start-end-radius: 4px;
}
.bubble.error {
  background: var(--danger-dim);
  border: 1px solid rgba(226,102,77,0.4);
  color: #F4C7BC;
}

.msg-actions {
  display: flex;
  gap: 4px;
}
.msg-action-btn {
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 6px;
  color: var(--text-faint);
}
.msg-action-btn:hover { background: var(--panel-raised); color: var(--text-dim); }
.msg-action-btn.active { color: var(--turquoise); }
.msg-action-btn.active.dislike { color: var(--danger); }

/* ---- Evidence strip (signature element) ---- */
.evidence-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.evidence-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-family: var(--font-mono);
  border: 1px solid transparent;
  transition: transform 0.12s var(--ease);
}
.evidence-chip:hover { transform: translateY(-1px); }
.evidence-chip.official {
  background: var(--turquoise-dim);
  border-color: var(--turquoise-line);
  color: var(--turquoise);
}
.evidence-chip.general {
  background: var(--amber-dim);
  border-color: var(--amber-line);
  color: var(--amber);
}
.evidence-chip .chip-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

.evidence-detail {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  font-size: 12px;
  color: var(--text-dim);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.evidence-detail-row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.evidence-detail-row:last-child { border-bottom: none; padding-bottom: 0; }
.evidence-detail-label {
  font-family: var(--font-mono);
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-faint);
  flex-shrink: 0;
}
.evidence-detail-value { text-align: end; font-family: var(--font-mono); font-size: 11.5px; }
.evidence-detail-value a { color: var(--turquoise); text-decoration: none; }
.evidence-detail-value a:hover { text-decoration: underline; }

/* ---- Rich-text answer rendering (lightweight Markdown-ish) ----
   Applied only to assistant bubbles. Each block gets dir="auto" so
   mixed Arabic/English paragraphs each align themselves correctly
   without breaking the surrounding layout. */
.rich-text { display: flex; flex-direction: column; gap: 10px; }
.rich-text > *:first-child { margin-top: 0; }
.rich-text > *:last-child { margin-bottom: 0; }
.rich-text p { margin: 0; white-space: pre-wrap; }
.rich-text strong { font-weight: 600; color: var(--text); }
.rich-text em { font-style: italic; }
.rich-text code {
  font-family: var(--font-mono);
  font-size: 0.92em;
  background: var(--panel-raised);
  padding: 1px 5px;
  border-radius: 4px;
}
.rich-text h1, .rich-text h2, .rich-text h3, .rich-text h4 {
  margin: 4px 0 0;
  font-weight: 600;
  line-height: 1.4;
}
.rich-text h1 { font-size: 16.5px; }
.rich-text h2 { font-size: 15.5px; }
.rich-text h3, .rich-text h4 { font-size: 14.5px; color: var(--turquoise); }
.rich-text ul, .rich-text ol {
  margin: 0;
  padding-inline-start: 22px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.rich-text li { line-height: 1.7; }
.rich-text li::marker { color: var(--turquoise); }
.rich-text blockquote {
  margin: 0;
  padding-inline-start: 12px;
  border-inline-start: 2px solid var(--turquoise-line);
  color: var(--text-dim);
}

/* ---- Inline citation line (e.g. "Source: NICE, ..., Page 33") ----
   Detected inside buildRichText() and pulled out of the normal paragraph
   flow so it reads as evidence metadata, not answer prose. Reuses the
   turquoise "official evidence" accent for visual continuity with
   .evidence-chip / .source-card. */
.rich-text .inline-citation {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 4px 7px;
  margin-top: 2px;
  padding-top: 9px;
  border-top: 1px dashed var(--border-strong);
  font-family: var(--font-mono);
  font-size: 11.5px;
  line-height: 1.6;
  color: var(--text-faint);
}
.rich-text .inline-citation .citation-label {
  flex-shrink: 0;
  color: var(--turquoise);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.rich-text .inline-citation .citation-value { color: var(--text-dim); }

/* ---- Sources panel (redesigned) ---- */
.sources-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  width: fit-content;
  padding: 6px 11px;
  border-radius: 999px;
  border: 1px solid var(--border-strong);
  background: var(--panel);
  color: var(--text-dim);
  font-size: 12px;
  font-weight: 500;
  transition: border-color 0.15s var(--ease), color 0.15s var(--ease);
}
.sources-toggle:hover { border-color: var(--turquoise-line); color: var(--text); }
.sources-toggle .chevron { transition: transform 0.18s var(--ease); flex-shrink: 0; }
.sources-toggle[aria-expanded="true"] .chevron { transform: rotate(180deg); }
.sources-toggle .count-badge {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-faint);
}

.sources-panel {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.source-card {
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--panel);
  overflow: hidden;
}
.source-card-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  width: 100%;
  text-align: start;
}
.source-card-icon {
  width: 26px; height: 26px;
  flex-shrink: 0;
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
}
.source-card.official .source-card-icon { background: var(--turquoise-dim); color: var(--turquoise); }
.source-card.general .source-card-icon { background: var(--amber-dim); color: var(--amber); }
.source-card-titles { flex: 1; min-width: 0; }
.source-card-name {
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.source-card-sub {
  font-size: 11px;
  color: var(--text-faint);
  margin-top: 1px;
}
.source-card-score {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-faint);
  flex-shrink: 0;
}
.source-card-chevron { flex-shrink: 0; color: var(--text-faint); transition: transform 0.18s var(--ease); }
.source-card.expanded .source-card-chevron { transform: rotate(180deg); }
.source-card-body {
  padding: 0 12px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.source-preview {
  font-size: 12px;
  line-height: 1.65;
  color: var(--text-dim);
  background: var(--panel-raised);
  border-radius: var(--radius-sm);
  padding: 9px 11px;
  white-space: pre-wrap;
}
.source-meta-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 16px;
  font-size: 11px;
}
.source-meta-item { display: flex; gap: 5px; color: var(--text-faint); }
.source-meta-item b { color: var(--text-dim); font-weight: 500; font-family: var(--font-mono); }
.source-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: var(--turquoise);
  width: fit-content;
}
.source-link:hover { text-decoration: underline; }

/* ---- Loading state ---- */
.thinking-row { display: flex; gap: 12px; align-items: center; }
.thinking-bubble {
  padding: 13px 16px;
  border-radius: var(--radius-lg);
  border-start-start-radius: 4px;
  background: var(--panel);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  color: var(--text-dim);
}
.dot-flow { display: flex; gap: 4px; }
.dot-flow span {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--turquoise);
  animation: dotflow 1.1s ease-in-out infinite;
}
.dot-flow span:nth-child(2) { animation-delay: 0.15s; }
.dot-flow span:nth-child(3) { animation-delay: 0.3s; }
@keyframes dotflow {
  0%, 60%, 100% { opacity: 0.25; transform: translateY(0); }
  30% { opacity: 1; transform: translateY(-2px); }
}

/* ---- Composer ---- */
.composer-wrap {
  border-top: 1px solid var(--border);
  padding: 14px 20px 16px;
  flex-shrink: 0;
}
.composer {
  max-width: var(--content-max-w);
  width: 100%;
  margin: 0 auto;
  display: flex;
  align-items: flex-end;
  gap: 10px;
  background: var(--panel);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  padding: 8px 8px 8px 16px;
  transition: border-color 0.15s var(--ease);
}
html[dir="rtl"] .composer { padding: 8px 16px 8px 8px; }
.composer:focus-within { border-color: var(--turquoise-line); }
.composer textarea {
  flex: 1;
  background: none;
  border: none;
  resize: none;
  max-height: 160px;
  font-size: 14px;
  line-height: 1.6;
  padding: 8px 0;
  outline: none;
}
.composer textarea::placeholder { color: var(--text-faint); }
.send-btn {
  width: 38px; height: 38px;
  flex-shrink: 0;
  border-radius: 50%;
  background: var(--turquoise);
  color: var(--turquoise-ink);
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.15s var(--ease), transform 0.1s var(--ease);
}
.send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.send-btn:not(:disabled):hover { transform: scale(1.05); }
.composer-hint {
  max-width: var(--content-max-w);
  margin: 8px auto 0;
  font-size: 11px;
  color: var(--text-faint);
  text-align: center;
}
.composer-disclaimer {
  max-width: var(--content-max-w);
  margin: 4px auto 0;
  font-size: 10.5px;
  color: var(--text-faint);
  text-align: center;
  opacity: 0.75;
  line-height: 1.5;
}

/* ---- Modal (About Project) ---- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(6, 10, 14, 0.6);
  backdrop-filter: blur(2px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
}
.modal {
  background: var(--panel);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  max-width: 460px;
  width: 100%;
  padding: 26px;
  box-shadow: var(--shadow-panel);
  animation: modalIn 0.2s var(--ease);
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.97) translateY(6px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.modal-header h2 { font-size: 16.5px; margin: 0; font-weight: 600; }
.modal p.modal-lead { font-size: 13px; color: var(--text-dim); line-height: 1.7; margin: 8px 0 18px; }
.modal-rows { display: flex; flex-direction: column; gap: 0; border-top: 1px solid var(--border); }
.modal-row {
  display: flex;
  justify-content: space-between;
  gap: 14px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12.5px;
}
.modal-row-label { color: var(--text-dim); }
.modal-row-value { font-family: var(--font-mono); font-size: 11.5px; text-align: end; color: var(--text); }

/* ---- About modal: bigger panel + tabs ---- */
.modal.modal-about {
  max-width: 620px;
  max-height: min(720px, 88vh);
  display: flex;
  flex-direction: column;
  padding: 22px 22px 0;
}
.modal-about .modal-header { flex-shrink: 0; }
.modal-about .modal-lead { flex-shrink: 0; }
.about-tabs {
  display: flex;
  gap: 4px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  scrollbar-width: none;
}
.about-tabs::-webkit-scrollbar { display: none; }
.about-tab {
  flex-shrink: 0;
  padding: 9px 13px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text-faint);
  border-bottom: 2px solid transparent;
  white-space: nowrap;
}
.about-tab:hover { color: var(--text-dim); }
.about-tab.active { color: var(--turquoise); border-color: var(--turquoise); }
.about-panels {
  overflow-y: auto;
  padding: 18px 0 22px;
  flex: 1;
}
.about-panel { display: none; flex-direction: column; gap: 14px; }
.about-panel.active { display: flex; }
.about-panel h3 {
  font-size: 12.5px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-faint);
  margin: 0;
  font-weight: 600;
}
.about-panel p {
  font-size: 13px;
  line-height: 1.75;
  color: var(--text-dim);
  margin: 0;
}
.about-panel ul {
  margin: 0;
  padding-inline-start: 20px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.about-panel li { font-size: 13px; line-height: 1.65; color: var(--text-dim); }
.about-panel li::marker { color: var(--turquoise); }

.tech-badges { display: flex; flex-wrap: wrap; gap: 8px; }
.tech-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--panel-raised);
  border: 1px solid var(--border-strong);
  font-size: 12px;
  font-family: var(--font-mono);
  color: var(--text);
}
.tech-badge .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--turquoise); flex-shrink: 0; }

.workflow-steps { display: flex; flex-direction: column; gap: 0; }
.workflow-step {
  display: flex;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.workflow-step:last-child { border-bottom: none; }
.workflow-num {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--turquoise-dim);
  color: var(--turquoise);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
}
.workflow-text { font-size: 13px; line-height: 1.6; color: var(--text-dim); }
.workflow-text b { color: var(--text); font-weight: 500; }

.pipeline-flow {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 0;
}
.pipeline-node {
  padding: 9px 13px;
  border-radius: var(--radius-sm);
  background: var(--panel-raised);
  border: 1px solid var(--border-strong);
  font-size: 12.5px;
  font-family: var(--font-mono);
  text-align: center;
  color: var(--text);
}
.pipeline-arrow {
  align-self: center;
  color: var(--text-faint);
  font-size: 13px;
  padding: 3px 0;
}

.lang-split { display: flex; gap: 10px; flex-wrap: wrap; }
.lang-card {
  flex: 1;
  min-width: 180px;
  padding: 12px 14px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  background: var(--panel-raised);
}
.lang-card-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.lang-card p { font-size: 12px; color: var(--text-dim); margin: 0; line-height: 1.6; }

/* ---- Toast ---- */
.toast {
  position: fixed;
  bottom: 24px;
  inset-inline-start: 50%;
  transform: translateX(-50%);
  background: var(--panel-raised);
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  padding: 9px 18px;
  font-size: 12.5px;
  box-shadow: var(--shadow-panel);
  z-index: 200;
  animation: toastIn 0.2s var(--ease);
}
html[dir="rtl"] .toast { transform: translateX(50%); }
@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(8px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

/* ==========================================================================
   Responsive
   ========================================================================== */
/* ---- Large desktop: a little more breathing room, cap growth ---- */
@media (min-width: 1440px) {
  :root { --content-max-w: 900px; }
  .main-header { padding: 16px 34px; }
}

/* ---- Laptop / small desktop ---- */
@media (max-width: 1240px) {
  :root { --sidebar-w: 248px; }
}

/* ---- Tablet: sidebar becomes an overlay drawer a bit earlier isn't
   needed yet, but tighten spacing so nothing feels cramped ---- */
@media (max-width: 1024px) and (min-width: 901px) {
  :root { --content-max-w: 700px; }
  .conversation { padding: 20px 18px 10px; }
}

@media (max-width: 900px) {
  .app-shell { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed;
    inset-block: 0;
    inset-inline-start: 0;
    width: min(300px, 84vw);
    z-index: 50;
    transform: translateX(-100%);
    transition: transform 0.24s var(--ease);
    box-shadow: var(--shadow-panel);
    padding-top: env(safe-area-inset-top, 0);
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  html[dir="rtl"] .sidebar { transform: translateX(100%); }
  .sidebar.open { transform: translateX(0); }
  .sidebar-scrim {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 40;
  }
  .sidebar-scrim.show { display: block; }
  .mobile-menu-btn { display: flex; }
  .example-grid { grid-template-columns: 1fr; }
  .conversation { padding: 18px 14px 8px; }
  .composer-wrap {
    padding: 12px 12px calc(14px + env(safe-area-inset-bottom, 0));
  }
  :root { --content-max-w: 100%; }
  .main-header { padding: 12px 14px; }
}

@media (max-width: 480px) {
  .header-title { font-size: 13.5px; }
  .header-sub { font-size: 10.5px; }
  .welcome h1 { font-size: 21px; }
  .welcome p { font-size: 13.5px; }
  .bubble { font-size: 13.5px; padding: 12px 14px; }
  .modal { padding: 20px; max-width: 100%; }
}

/* Never let long unbroken tokens (URLs, IDs) blow out mobile width */
.bubble, .evidence-detail-value, .rich-text { overflow-wrap: anywhere; }


/* ==========================================================================
   Top navigation (Landing / App / Dashboard switcher)
   ========================================================================== */
:root { --topnav-h: 60px; }

.topnav {
  height: var(--topnav-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 0 22px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 30;
}
.topnav-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  border: none;
  background: none;
  color: inherit;
  padding: 0;
  flex-shrink: 0;
}
.topnav-brand .brand-mark { width: 26px; height: 26px; }
.topnav-brand span { font-weight: 600; font-size: 14px; white-space: nowrap; }
.topnav-links { display: flex; align-items: center; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.topnav-links::-webkit-scrollbar { display: none; }
.topnav-links button {
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text-dim);
  border: 1px solid transparent;
  white-space: nowrap;
  transition: border-color 0.15s var(--ease), color 0.15s var(--ease), background 0.15s var(--ease);
}
.topnav-links button:hover { background: var(--panel-raised); color: var(--text); }
.topnav-links button.active { background: var(--turquoise-dim); color: var(--turquoise); border-color: var(--turquoise-line); }
.topnav-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

.topnav-theme-btn {
  width: 32px; height: 32px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  border: 1px solid var(--border-strong);
  color: var(--text-dim);
  transition: border-color 0.15s var(--ease), color 0.15s var(--ease), background 0.15s var(--ease);
}
.topnav-theme-btn:hover { border-color: var(--turquoise-line); color: var(--turquoise); background: var(--turquoise-dim); }
.topnav-theme-btn svg { display: block; }
.topnav-theme-btn .icon-moon { display: none; }
html[data-theme="light"] .topnav-theme-btn .icon-sun { display: none; }
html[data-theme="light"] .topnav-theme-btn .icon-moon { display: block; }

@media (max-width: 720px) {
  .topnav { padding: 0 12px; gap: 8px; }
  .topnav-brand span { display: none; }
}
@media (max-width: 420px) {
  .topnav-links button { padding: 6px 10px; font-size: 11.5px; }
}

/* ==========================================================================
   View switching (Landing / App / Dashboard)
   ========================================================================== */
[data-view] { display: none; }
[data-view].active { display: block; }
#view-app .app-shell {
  height: calc(100vh - var(--topnav-h));
  height: calc(100dvh - var(--topnav-h));
}

/* ==========================================================================
   Landing page
   ========================================================================== */
.lp-hero {
  text-align: center;
  padding: 68px 24px 52px;
  max-width: 760px;
  margin: 0 auto;
}
.lp-hero .brand-mark { width: 46px; height: 46px; margin: 0 auto 22px; }
.lp-eyebrow {
  display: inline-block;
  font-size: 11px;
  font-family: var(--font-mono);
  letter-spacing: 0.06em;
  color: var(--turquoise);
  border: 1px dashed var(--turquoise-line);
  padding: 5px 14px;
  border-radius: 20px;
  margin-bottom: 20px;
}
.lp-hero h1 { font-size: clamp(24px, 4vw, 36px); font-weight: 600; margin: 0 0 10px; letter-spacing: -0.01em; }
.lp-hero .lp-subtitle { font-size: 14.5px; color: var(--turquoise); font-weight: 600; margin-bottom: 16px; }
.lp-hero p.lp-desc { font-size: 14px; color: var(--text-dim); line-height: 1.8; margin: 0 auto 28px; max-width: 560px; }
.lp-hero-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.lp-btn {

  border: 1px solid transparent; transition: transform 0.15s var(--ease), background 0.15s var(--ease), opacity 0.15s var(--ease);
}

.lp-btn-outline:hover { background: var(--turquoise-dim); }

.lp-section { padding: 50px 24px; max-width: 980px; margin: 0 auto; }
.lp-section-head { text-align: center; margin-bottom: 32px; }
.lp-section-head h2 { font-size: 21px; font-weight: 600; margin: 0 0 6px; }
.lp-section-head p { font-size: 13px; color: var(--text-dim); margin: 0; max-width: 560px; margin-inline: auto; line-height: 1.6; }

.lp-stats {

}

.lp-stat-label { font-size: 11px; color: var(--text-dim); margin-top: 5px; line-height: 1.4; }

.lp-feature-list { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 9px; }
.lp-feature-item {

  font-size: 13.5px; color: var(--text-dim); line-height: 1.6;

}
.lp-feature-item:hover { border-color: var(--turquoise-line); }
.lp-feature-item .dot3 { width: 7px; height: 7px; border-radius: 50%; background: var(--turquoise); margin-top: 6px; flex-shrink: 0; }

.lp-disclaimer {

}

}

/* ==========================================================================
   Dashboard
   ========================================================================== */
#view-dashboard { max-width: 900px; margin: 0 auto; padding: 44px 24px 60px; }
.db-head { text-align: center; margin-bottom: 30px; }
.db-head h2 { font-size: 21px; font-weight: 600; margin: 0 0 6px; }
.db-head p { font-size: 13px; color: var(--text-dim); margin: 0; }
.db-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 22px; }
.db-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px; text-align: center; }
.db-card .db-num { font-family: var(--font-mono); font-size: 24px; font-weight: 700; color: var(--turquoise); }
.db-card .db-label { font-size: 11.5px; color: var(--text-dim); margin-top: 6px; }
.db-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/**
 * api.js — thin client for the Medical RAG Assistant backend.
 *
 * Talks to the real FastAPI endpoints defined in src/api/main.py:
 *   POST /api/chat          -> ChatResponse
 *   GET  /api/health        -> HealthResponse
 *   GET  /api/system-info   -> SystemInfoResponse
 *
 * No response is ever fabricated here — a network/server failure always
 * surfaces as a thrown ApiError for the caller to handle explicitly.
 */

const REQUEST_TIMEOUT_MS = 45000;

class ApiError extends Error {
  constructor(message, status) {
    super(message);
    this.name = "ApiError";
    this.status = status || null;
  }
}

async function withTimeout(promiseFactory, ms) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  try {
    return await promiseFactory(controller.signal);
  } finally {
    clearTimeout(timer);
  }
}

const Api = {
  /**
   * Sends a user message + prior chat_history to the backend and
   * returns the parsed ChatResponse. Throws ApiError on any failure
   * (network down, timeout, 4xx/5xx).
   */
  async sendMessage(message, chatHistory) {
    let res;
    try {
      res = await withTimeout(
        (signal) =>
          fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message, chat_history: chatHistory || [] }),
            signal,
          }),
        REQUEST_TIMEOUT_MS
      );
    } catch (err) {
      if (err.name === "AbortError") {
        throw new ApiError("timeout");
      }
      throw new ApiError("network");
    }

    if (!res.ok) {
      let detail = null;
      try {
        const body = await res.json();
        detail = body.detail;
      } catch (_) {
        /* response wasn't JSON — ignore, we still have res.status */
      }
      throw new ApiError(detail || "server_error", res.status);
    }

    return res.json();
  },

  async getSystemInfo() {
    try {
      const res = await withTimeout(
        (signal) => fetch("/api/system-info", { signal }),
        10000
      );
      if (!res.ok) throw new ApiError("server_error", res.status);
      return res.json();
    } catch (err) {
      if (err instanceof ApiError) throw err;
      throw new ApiError("network");
    }
  },

  async checkHealth() {
    try {
      const res = await withTimeout(
        (signal) => fetch("/api/health", { signal }),
        6000
      );
      return res.ok;
    } catch (_) {
      return false;
    }
  },
};

/* ==========================================================================
   2. State + persistence
   ========================================================================== */
const STORAGE_KEY = "medrag_conversations_v1";
const LANG_KEY = "medrag_lang";
const THEME_KEY = "medrag_theme";

function detectDefaultLang() {
  const saved = localStorage.getItem(LANG_KEY);
  if (saved === "ar" || saved === "en") return saved;
  return (navigator.language || "").toLowerCase().startsWith("en") ? "en" : "ar";
}

function detectDefaultTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved === "light" || saved === "dark") return saved;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
}

const State = {
  lang: detectDefaultLang(),
  theme: detectDefaultTheme(),
  conversations: [],
  activeId: null,
  sending: false,
};

function applyTheme() {
  document.documentElement.setAttribute("data-theme", State.theme);
  localStorage.setItem(THEME_KEY, State.theme);
}

function toggleTheme() {
  State.theme = State.theme === "light" ? "dark" : "light";
  applyTheme();
}

function t(key) {
  return I18N[State.lang][key];
}

function loadConversations() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    State.conversations = raw ? JSON.parse(raw) : [];
  } catch (_) {
    State.conversations = [];
  }
}

function persistConversations() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(State.conversations));
}

function getActiveConversation() {
  return State.conversations.find((c) => c.id === State.activeId) || null;
}

function createConversation(firstMessageText) {
  const conv = {
    id: "c_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
    title: firstMessageText.slice(0, 48) + (firstMessageText.length > 48 ? "…" : ""),
    timestamp: Date.now(),
    messages: [], // { role, content, sources?, routing?, feedback? }
  };
  State.conversations.unshift(conv);
  State.activeId = conv.id;
  return conv;
}

   3. Rendering
   ========================================================================== */

  shell: document.querySelector(".app-shell"),
  sidebar: document.querySelector(".sidebar"),
  scrim: document.querySelector(".sidebar-scrim"),
  historyList: document.querySelector(".history-list"),
  historyLabel: document.querySelector(".history-label"),
  newChatBtn: document.querySelector(".new-chat-btn"),
  langButtons: document.querySelectorAll(".lang-toggle button"),
  aboutLink: document.querySelector(".about-link"),
  statusPill: document.querySelector(".status-pill"),
  statusDot: document.querySelector(".status-dot"),
  statusText: document.querySelector(".status-text"),
  mobileMenuBtn: document.querySelector(".mobile-menu-btn"),
  headerTitle: document.querySelector(".header-title"),
  headerSub: document.querySelector(".header-sub-text"),
  aboutBtnHeader: document.querySelector(".header-about-btn"),
  conversation: document.querySelector(".conversation"),
  composerForm: document.querySelector(".composer"),
  textarea: document.querySelector(".composer textarea"),
  sendBtn: document.querySelector(".send-btn"),

  modalRoot: document.querySelector(".modal-root"),
  toastRoot: document.querySelector(".toast-root"),
  themeToggle: document.querySelector(".theme-toggle"),
  headerThemeBtn: document.querySelector(".header-theme-btn"),
  topnavThemeBtn: document.querySelector(".topnav-theme-btn"),
};

function applyLanguage() {
  document.documentElement.lang = State.lang;
  document.documentElement.dir = I18N[State.lang].dir;
  localStorage.setItem(LANG_KEY, State.lang);

  el.langButtons.forEach((btn) => {
    btn.classList.toggle("active", btn.dataset.lang === State.lang);
  });

  document.querySelector(".brand-name").textContent = t("brandName");
  document.querySelector(".brand-sub").textContent = t("brandSub");
  el.newChatBtn.lastElementChild.textContent = t("newChat");
  el.historyLabel.textContent = t("historyLabel");
  el.aboutLink.lastElementChild.textContent = t("aboutProject");
  el.headerTitle.textContent = t("headerTitle");
  el.textarea.placeholder = t("placeholder");
  el.composerHint.textContent = t("composerHint");
  if (el.composerDisclaimer) el.composerDisclaimer.textContent = t("disclaimer");

  updateStatusPill(lastKnownOnline);
  renderHistory();
  renderConversation();
}

let lastKnownOnline = true;
function updateStatusPill(online) {
  lastKnownOnline = online;
  el.statusDot.classList.toggle("ok", online);
  el.statusDot.classList.toggle("down", !online);
  el.statusText.textContent = online ? t("statusOnline") : t("statusOffline");
  el.headerSub.textContent = online ? t("headerSubOnline") : t("headerSubOffline");
}

function renderHistory() {
  el.historyList.innerHTML = "";
  if (State.conversations.length === 0) {
    const empty = document.createElement("div");
    empty.className = "history-empty";
    empty.textContent = t("historyEmpty");
    el.historyList.appendChild(empty);
    return;
  }

  State.conversations.forEach((conv) => {
    const item = document.createElement("div");
    item.className = "history-item" + (conv.id === State.activeId ? " active" : "");

    const title = document.createElement("div");
    title.className = "history-item-title";
    title.textContent = conv.title;
    title.addEventListener("click", () => {
      State.activeId = conv.id;
      renderHistory();
      renderConversation();
      closeMobileSidebar();
    });

    const menuBtn = document.createElement("button");
    menuBtn.className = "history-menu-btn";
    menuBtn.setAttribute("aria-label", t("rename"));
    menuBtn.innerHTML = dotsIcon();
    menuBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      openHistoryMenu(item, conv);
    });

    item.appendChild(title);
    item.appendChild(menuBtn);
    el.historyList.appendChild(item);
  });
}

function openHistoryMenu(itemEl, conv) {
  document.querySelectorAll(".history-popover").forEach((p) => p.remove());
  const pop = document.createElement("div");
  pop.className = "history-popover";

  const renameBtn = document.createElement("button");
  renameBtn.textContent = t("rename");
  renameBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const newTitle = prompt(t("rename") + ":", conv.title);
    if (newTitle && newTitle.trim()) {
      conv.title = newTitle.trim().slice(0, 60);
      persistConversations();
      renderHistory();
    }
    pop.remove();
  });

  const deleteBtn = document.createElement("button");
  deleteBtn.className = "danger";
  deleteBtn.textContent = t("deleteChat");
  deleteBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    State.conversations = State.conversations.filter((c) => c.id !== conv.id);
    if (State.activeId === conv.id) State.activeId = null;
    persistConversations();
    renderHistory();
    renderConversation();
    pop.remove();
  });

  pop.appendChild(renameBtn);
  pop.appendChild(deleteBtn);
  itemEl.appendChild(pop);

  setTimeout(() => {
    document.addEventListener(
      "click",
      function handler() {
        pop.remove();
        document.removeEventListener("click", handler);
      },
      { once: true }
    );
  }, 0);
}

function renderConversation() {
  const conv = getActiveConversation();
  el.conversation.innerHTML = "";

  if (!conv || conv.messages.length === 0) {
    el.conversation.appendChild(buildWelcome());
    return;
  }

  const inner = document.createElement("div");
  inner.className = "conversation-inner";
  conv.messages.forEach((msg, idx) => inner.appendChild(buildMessageRow(msg, idx, conv)));
  el.conversation.appendChild(inner);
  el.conversation.scrollTop = el.conversation.scrollHeight;
}

function buildWelcome() {
  const wrap = document.createElement("div");
  wrap.className = "welcome";
  wrap.innerHTML = `
    <div class="welcome-glyph"></div>
    <h1>${t("welcomeTitle")}</h1>
    <p>${t("welcomeLead")}</p>
    <p>${t("welcomeSub")}</p>
    <div class="welcome-legend">
      <span><span class="legend-dot turquoise"></span>${t("legendOfficial")}</span>
      <span><span class="legend-dot amber"></span>${t("legendGeneral")}</span>
    </div>
    <div class="example-grid"></div>
    <div class="welcome-disclaimer">${t("disclaimer")}</div>
  `;
  const grid = wrap.querySelector(".example-grid");
  t("examples").forEach((ex) => {
    const card = document.createElement("button");
    card.className = "example-card";
    card.type = "button";
    card.textContent = ex;
    card.addEventListener("click", () => {
      el.textarea.value = ex;
      handleSend();
    });
    grid.appendChild(card);
  });
  return wrap;
}

function routeLabel(source) {
  if (source === "guidelines") return t("routeGuidelines");
  if (source === "arabic") return t("routeArabic");
  return t("routeBoth");
}

function isOfficialSource(src) {
  return Boolean(src.authority_family || src.authority || src.source_type === "guidelines");
}

/* Best-effort field extraction — the backend's SourceItem is intentionally
   flexible (different fields per route), so every getter here tries the
   plausible field names and returns null instead of inventing a value. */
function sourceDisplayName(src) {
  return (
    src.document_name || src.title || src.book_name || src.book ||
    src.source_name || src.name || src.authority_family || src.authority ||
    src.document_id || null
  );
}
function sourceUrl(src) {
  const candidate = src.document_link || src.url || src.source_url || src.link || src.pdf_url || null;
  if (!candidate || typeof candidate !== "string") return null;
  // Only treat it as a real reference if it looks like an actual path/URL.
  if (/^https?:\/\//i.test(candidate) || candidate.startsWith("/")) return candidate;
  return null;
}
function sourcePreview(src) {
  const text = src.text || src.content || src.chunk_text || src.preview || src.snippet || null;
  if (!text || typeof text !== "string") return null;
  return text.length > 320 ? text.slice(0, 320).trim() + "…" : text;
}
function sourceChunkId(src) {
  return src.chunk_id || src.chunkId || (src.id && String(src.id).length < 40 ? src.id : null) || null;
}
function sourceSub(src) {
  const official = isOfficialSource(src);
  const parts = [];
  if (official) {
    if (src.category) parts.push(src.category);
  } else {
    parts.push(src.category || t("generalConsult"));
  }
  if (src.start_page) {
    parts.push(
      src.end_page && src.end_page !== src.start_page
        ? `${t("detailPage")} ${src.start_page}–${src.end_page}`
        : `${t("detailPage")} ${src.start_page}`
    );
  }
  return parts.join(" · ");
}

function buildSourceCard(src) {
  const official = isOfficialSource(src);
  const card = document.createElement("div");
  card.className = "source-card " + (official ? "official" : "general");

  const head = document.createElement("button");
  head.type = "button";
  head.className = "source-card-head";
  head.setAttribute("aria-expanded", "false");

  const icon = document.createElement("div");
  icon.className = "source-card-icon";
  icon.textContent = official ? "📖" : "📄";
  icon.setAttribute("aria-hidden", "true");

  const titles = document.createElement("div");
  titles.className = "source-card-titles";
  const nameEl = document.createElement("div");
  nameEl.className = "source-card-name";
  nameEl.textContent = sourceDisplayName(src) || (official ? t("routeGuidelines") : t("generalConsult"));
  const subEl = document.createElement("div");
  subEl.className = "source-card-sub";
  subEl.textContent = sourceSub(src);
  titles.appendChild(nameEl);
  if (subEl.textContent) titles.appendChild(subEl);

  head.appendChild(icon);
  head.appendChild(titles);

  if (typeof src.score === "number") {
    const scoreEl = document.createElement("div");
    scoreEl.className = "source-card-score";
    scoreEl.textContent = src.score.toFixed(3);
    head.appendChild(scoreEl);
  }

  const chevron = document.createElement("span");
  chevron.className = "source-card-chevron";
  chevron.innerHTML = chevronIcon();
  head.appendChild(chevron);

  const body = document.createElement("div");
  body.className = "source-card-body";
  body.hidden = true;

  const preview = sourcePreview(src);
  if (preview) {
    const previewEl = document.createElement("div");
    previewEl.className = "source-preview";
    previewEl.textContent = preview;
    previewEl.dir = "auto";
    body.appendChild(previewEl);
  }

  const metaGrid = document.createElement("div");
  metaGrid.className = "source-meta-grid";
  const chunkId = sourceChunkId(src);
  if (chunkId) metaGrid.appendChild(buildMetaItem(t("detailDoc"), chunkId));
  if (src.category && official) metaGrid.appendChild(buildMetaItem(t("detailCategory"), src.category));
  if (metaGrid.children.length) body.appendChild(metaGrid);

  const url = sourceUrl(src);
  if (url) {
    const link = document.createElement("a");
    link.className = "source-link";
    link.href = url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = t("viewSource") + " →";
    body.appendChild(link);
  }

  head.addEventListener("click", () => {
    const expanded = card.classList.toggle("expanded");
    head.setAttribute("aria-expanded", String(expanded));
    body.hidden = !expanded;
  });

  card.appendChild(head);
  card.appendChild(body);
  return card;
}

function buildMetaItem(label, value) {
  const item = document.createElement("div");
  item.className = "source-meta-item";
  const l = document.createElement("span");
  l.textContent = label + ":";
  const v = document.createElement("b");
  v.textContent = value;
  item.appendChild(l);
  item.appendChild(v);
  return item;
}

/* ==========================================================================
   3b. Answer rendering (lightweight Markdown-ish -> DOM)
   Handles paragraphs, line breaks, bullet/numbered lists, bold text and
   simple headings without pulling in a Markdown dependency. Never touches
   the actual answer text — only how it's structured visually. Each block
   gets dir="auto" so mixed Arabic/English content aligns itself correctly.
   ========================================================================== */
function escapeHtml(str) {
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function inlineFormat(str) {
  let s = escapeHtml(str);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");
  return s;
}

function buildRichText(rawText) {
  const wrap = document.createElement("div");
  wrap.className = "rich-text";
  const lines = String(rawText || "").replace(/\r\n/g, "\n").split("\n");

  let currentList = null;
  let paragraphBuf = [];

  const flushParagraph = () => {
    if (paragraphBuf.length) {
      const p = document.createElement("p");
      p.dir = "auto";
      p.innerHTML = paragraphBuf.map(inlineFormat).join("<br>");
      wrap.appendChild(p);
      paragraphBuf = [];
    }
  };

  for (const line of lines) {
    const trimmed = line.trim();

    if (trimmed === "") { flushParagraph(); currentList = null; continue; }

    const headingMatch = trimmed.match(/^(#{1,4})\s+(.*)$/);
    if (headingMatch) {
      flushParagraph(); currentList = null;
      const h = document.createElement("h" + Math.min(headingMatch[1].length, 4));
      h.dir = "auto";
      h.innerHTML = inlineFormat(headingMatch[2]);
      wrap.appendChild(h);
      continue;
    }

    const citationMatch = trimmed.match(/^\*{0,2}(Source|Sources|المصدر|المصادر)\*{0,2}\s*[:：]\s*(.+)$/i);
    if (citationMatch) {
      flushParagraph(); currentList = null;
      const cite = document.createElement("div");
      cite.className = "inline-citation";
      cite.dir = "auto";
      const label = document.createElement("span");
      label.className = "citation-label";
      label.textContent = citationMatch[1] + ":";
      const value = document.createElement("span");
      value.className = "citation-value";
      value.innerHTML = inlineFormat(citationMatch[2]);
      cite.appendChild(label);
      cite.appendChild(value);
      wrap.appendChild(cite);
      continue;
    }

    const boldHeadingMatch = trimmed.match(/^\*\*([^*]{1,80})\*\*:?$/);
    if (boldHeadingMatch) {
      flushParagraph(); currentList = null;
      const h = document.createElement("h4");
      h.dir = "auto";
      h.textContent = boldHeadingMatch[1];
      wrap.appendChild(h);
      continue;
    }

    const ulMatch = trimmed.match(/^[-•]\s+(.*)$/);
    const olMatch = trimmed.match(/^(\d+)[.)]\s+(.*)$/);

    if (ulMatch) {
      flushParagraph();
      if (!currentList || currentList.type !== "ul") {
        const ul = document.createElement("ul");
        wrap.appendChild(ul);
        currentList = { type: "ul", el: ul };
      }
      const li = document.createElement("li");
      li.dir = "auto";
      li.innerHTML = inlineFormat(ulMatch[1]);
      currentList.el.appendChild(li);
      continue;
    }

    if (olMatch) {
      flushParagraph();
      if (!currentList || currentList.type !== "ol") {
        const ol = document.createElement("ol");
        wrap.appendChild(ol);
        currentList = { type: "ol", el: ol };
      }
      const li = document.createElement("li");
      li.dir = "auto";
      li.innerHTML = inlineFormat(olMatch[2]);
      currentList.el.appendChild(li);
      continue;
    }

    currentList = null;
    paragraphBuf.push(line);
  }
  flushParagraph();

  if (!wrap.children.length) {
    const p = document.createElement("p");
    p.dir = "auto";
    p.textContent = rawText;
    wrap.appendChild(p);
  }
  return wrap;
}

function buildMessageRow(msg, idx, conv) {

  if (msg.role === "assistant" && !msg.isError) {
    bubble.style.whiteSpace = "normal"; // rich-text handles its own line breaks
    bubble.appendChild(buildRichText(msg.content));
  } else {

  if (msg.isError) {
    const retryBtn = document.createElement("button");

    retryBtn.textContent = t("retry");
    retryBtn.addEventListener("click", () => retryFromError(idx, conv));

    const copyBtn = iconButton(copyIcon(), t("copy"));
    copyBtn.addEventListener("click", () => copyToClipboard(msg.content));

    const regenBtn = iconButton(regenIcon(), t("regenerate"));
    regenBtn.addEventListener("click", () => regenerate(idx, conv));

    const likeBtn = iconButton(likeIcon(), t("like"));
    likeBtn.classList.toggle("active", msg.feedback === "like");
    likeBtn.setAttribute("aria-pressed", String(msg.feedback === "like"));
    likeBtn.addEventListener("click", () => setFeedback(conv, idx, "like", likeBtn, dislikeBtn));

    const dislikeBtn = iconButton(dislikeIcon(), t("dislike"), "dislike");
    dislikeBtn.classList.toggle("active", msg.feedback === "dislike");
    dislikeBtn.setAttribute("aria-pressed", String(msg.feedback === "dislike"));
    dislikeBtn.addEventListener("click", () => setFeedback(conv, idx, "dislike", likeBtn, dislikeBtn));

    actions.appendChild(copyBtn);
    actions.appendChild(regenBtn);
    actions.appendChild(likeBtn);
    actions.appendChild(dislikeBtn);
    col.appendChild(actions);

    if (msg.sources && msg.sources.length > 0) {
      const toggleBtn = document.createElement("button");
      toggleBtn.type = "button";
      toggleBtn.className = "sources-toggle";
      toggleBtn.setAttribute("aria-expanded", "false");
      toggleBtn.innerHTML =
        `<span class="chevron">${chevronIcon()}</span>` +
        `<span class="label-text">${t("sourcesShow")}</span>` +
        `<span class="count-badge">(${msg.sources.length})</span>`;

      const panel = document.createElement("div");
      panel.className = "sources-panel";
      panel.style.display = "none";
      msg.sources.forEach((src) => panel.appendChild(buildSourceCard(src)));

      let shown = false;
      toggleBtn.addEventListener("click", () => {
        shown = !shown;
        panel.style.display = shown ? "flex" : "none";
        toggleBtn.setAttribute("aria-expanded", String(shown));
        toggleBtn.querySelector(".label-text").textContent = shown ? t("sourcesHide") : t("sourcesShow");
      });

      col.appendChild(toggleBtn);
      col.appendChild(panel);
    }
  }

  row.appendChild(avatar);
  row.appendChild(col);
  return row;
}

function setFeedback(conv, idx, value, likeBtn, dislikeBtn) {
  const msg = conv.messages[idx];
  msg.feedback = msg.feedback === value ? null : value;
  persistConversations();
  likeBtn.classList.toggle("active", msg.feedback === "like");
  likeBtn.setAttribute("aria-pressed", String(msg.feedback === "like"));
  dislikeBtn.classList.toggle("active", msg.feedback === "dislike");
  dislikeBtn.setAttribute("aria-pressed", String(msg.feedback === "dislike"));
}

function iconButton(svg, label, extraClass) {
  const btn = document.createElement("button");
  btn.className = "msg-action-btn" + (extraClass ? " " + extraClass : "");
  btn.setAttribute("aria-label", label);
  btn.title = label;
  btn.innerHTML = svg;
  return btn;
}

/* ==========================================================================
   4. Chat flow
   ========================================================================== */
function buildBackendHistory(conv) {
  // Backend ChatMessage only wants { role, content }
  return conv.messages
    .filter((m) => !m.isError)
    .map((m) => ({ role: m.role, content: m.content }));
}

async function handleSend() {
  const text = el.textarea.value.trim();
  if (!text || State.sending) return;

  let conv = getActiveConversation();
  if (!conv) conv = createConversation(text);

  conv.messages.push({ role: "user", content: text });
  el.textarea.value = "";
  autoResizeTextarea();
  persistConversations();
  renderHistory();
  renderConversation();

  await sendAndAppendAnswer(conv);
}

async function sendAndAppendAnswer(conv) {
  State.sending = true;
  el.sendBtn.disabled = true;

  const thinkingEl = appendThinkingRow();
  const historyForBackend = buildBackendHistory(conv).slice(0, -1); // exclude the message we just added; backend appends it

  try {
    const lastUserMsg = conv.messages[conv.messages.length - 1].content;
    const result = await Api.sendMessage(lastUserMsg, historyForBackend);

    thinkingEl.remove();
    conv.messages.push({
      role: "assistant",
      content: result.answer,
      sources: result.sources || [],
      routing: result.routing || null,
      trustScore: typeof result.trust_score === "number" ? result.trust_score : null,
      trustLabel: result.trust_label || null,
    });
    trackAnswer(result.routing ? result.routing.source : null, State.lang);
    updateStatusPill(true);
  } catch (err) {
    thinkingEl.remove();
    updateStatusPill(err.status !== undefined ? true : false);
    const message =
      err.message === "timeout"
        ? t("errorTimeout")
        : err.message === "network"
        ? t("errorNetwork")
        : t("errorServer");
    conv.messages.push({ role: "assistant", content: message, isError: true });
  }

  persistConversations();
  renderHistory();
  renderConversation();
  State.sending = false;
  el.sendBtn.disabled = false;
}

function appendThinkingRow() {
  const inner = el.conversation.querySelector(".conversation-inner") || (() => {
    const i = document.createElement("div");
    i.className = "conversation-inner";
    el.conversation.appendChild(i);
    return i;
  })();

  const row = document.createElement("div");
  row.className = "msg-row thinking-row";
  row.innerHTML = `
    <div class="avatar assistant">${botIcon()}</div>
    <div class="thinking-bubble">
      <span class="thinking-text">${t("thinking1")}</span>
      <span class="dot-flow"><span></span><span></span><span></span></span>
    </div>
  `;
  inner.appendChild(row);
  el.conversation.scrollTop = el.conversation.scrollHeight;

  const textEl = row.querySelector(".thinking-text");
  const swapTimer = setTimeout(() => {
    if (textEl) textEl.textContent = t("thinking2");
  }, 1300);
  row.dataset.timer = swapTimer;

  const originalRemove = row.remove.bind(row);
  row.remove = () => {
    clearTimeout(swapTimer);
    originalRemove();
  };
  return row;
}

function retryFromError(idx, conv) {
  conv.messages.splice(idx, 1); // drop the error bubble
  persistConversations();
  renderConversation();
  sendAndAppendAnswer(conv);
}

function regenerate(idx, conv) {
  // Find the user message preceding this assistant message and resend it.
  let userIdx = idx - 1;
  while (userIdx >= 0 && conv.messages[userIdx].role !== "user") userIdx--;
  if (userIdx < 0) return;

  conv.messages = conv.messages.slice(0, idx); // drop this assistant answer onward up to (not incl) it... keep the user msg
  persistConversations();
  renderConversation();
  sendAndAppendAnswer(conv);
}

async function copyToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
    showToast(t("copied"));
  } catch (_) {
    showToast(t("copied"));
  }
}

function showToast(message) {
  const toast = document.createElement("div");
  toast.className = "toast";
  toast.textContent = message;
  el.toastRoot.appendChild(toast);
  setTimeout(() => toast.remove(), 1800);
}

  }

      item.className = "lp-feature-item";
      item.innerHTML = `<span class="dot3"></span><span>${feat}</span>`;
      featuresWrap.appendChild(item);
    });
  }

  setText("lp-workflow-title", t("lpWorkflowTitle"));
  setText("lp-workflow-sub", t("lpWorkflowSub"));
  const wfWrap = document.getElementById("lp-workflow");
  if (wfWrap) {
    wfWrap.innerHTML = "";
    t("workflowSteps").forEach((text, idx) => {
      const step = document.createElement("div");
      step.className = "workflow-step";
      step.innerHTML = `<div class="workflow-num">${idx + 1}</div><div class="workflow-text">${text}</div>`;
      wfWrap.appendChild(step);
    });
  }

  setText("lp-pipeline-title", t("lpPipelineTitle"));
  setText("lp-pipeline-sub", t("pipelineIntro"));
  const plWrap = document.getElementById("lp-pipeline");
  if (plWrap) {
    plWrap.innerHTML = "";
    const nodes = t("pipelineNodes");
    nodes.forEach((label, idx) => {
      const node = document.createElement("div");
      node.className = "pipeline-node";
      node.textContent = label;
      plWrap.appendChild(node);
      if (idx < nodes.length - 1) {
        const arrow = document.createElement("div");
        arrow.className = "pipeline-arrow";
        arrow.textContent = "↓";
        plWrap.appendChild(arrow);
      }
    });
  }

  setText("lp-tech-title", t("lpTechTitle"));
  setText("lp-tech-sub", t("techIntro"));

  setText("lp-about-title", t("lpAboutTitle"));
  const aboutWrap = document.getElementById("lp-about-grid");
  if (aboutWrap) {
    aboutWrap.innerHTML = "";
    [
      [t("tabOverview"), t("ovParagraph1")],
      [t("ovWhyRagTitle"), t("ovWhyRag")],
      ["🇬🇧 " + t("langEnTitle"), t("langEnDesc")],
      ["🇸🇦 " + t("langArTitle"), t("langArDesc")],
    ].forEach(([title, desc]) => {
      const card = document.createElement("div");
      card.className = "lang-card";
      card.innerHTML = `<div class="lang-card-title">${title}</div><p>${desc}</p>`;
      aboutWrap.appendChild(card);
    });
  }
  setText("lp-about-disclaimer", t("disclaimer"));
  setText("lp-footer", t("lpFooterNote"));

  renderLandingTech();
}

async function renderLandingTech() {
  const wrap = document.getElementById("lp-tech-badges");
  if (!wrap) return;
  wrap.innerHTML = "";
  const staticTech = ["FastAPI", "Python", "ChromaDB", "BM25", "HTML / CSS / JavaScript"];
  staticTech.forEach((name) => wrap.appendChild(techBadge(name)));
  try {
    const info = await Api.getSystemInfo();
    [info.embedding_model, info.vector_store, info.sparse_retrieval, info.guidelines_llm, info.arabic_llm, info.parsing]
      .filter(Boolean)
      .forEach((name) => wrap.appendChild(techBadge(name)));
  } catch (_) {
    /* static badges above already give a reasonable picture */
  }
}

/* ==========================================================================
   6d. Dashboard (local-only usage stats, mirrors chat history in localStorage)
   ========================================================================== */
const STATS_KEY = "medrag_stats_v1";

function loadStats() {
  const empty = { routeCounts: { guidelines: 0, arabic: 0, both: 0 }, langCounts: { ar: 0, en: 0 }, lastActive: null };
  try {
    const raw = localStorage.getItem(STATS_KEY);
    if (!raw) return empty;
    const parsed = JSON.parse(raw);
    return {
      routeCounts: Object.assign({}, empty.routeCounts, parsed.routeCounts),
      langCounts: Object.assign({}, empty.langCounts, parsed.langCounts),
      lastActive: parsed.lastActive || null,
    };
  } catch (_) {
    return empty;
  }
}

function trackAnswer(routeSource, uiLang) {
  const stats = loadStats();
  stats.lastActive = new Date().toISOString();
  if (routeSource && stats.routeCounts[routeSource] !== undefined) stats.routeCounts[routeSource]++;
  if (uiLang && stats.langCounts[uiLang] !== undefined) stats.langCounts[uiLang]++;
  localStorage.setItem(STATS_KEY, JSON.stringify(stats));
}

function setBar(fillId, labelId, labelText, value, max, variant) {
  const fillEl = document.getElementById(fillId);
  const labelEl = document.getElementById(labelId);
  if (labelEl) labelEl.textContent = `${labelText} (${value})`;
  if (fillEl) {
    fillEl.style.width = Math.round((value / max) * 100) + "%";
    fillEl.classList.toggle("amber", Boolean(variant));
  }
}

function renderDashboard() {
  setText("dash-title", t("dashTitle"));
  setText("dash-sub", t("dashSub"));

  const totalConversations = State.conversations.length;
  const totalQuestions = State.conversations.reduce(
    (sum, c) => sum + c.messages.filter((m) => m.role === "user").length,
    0
  );
  const stats = loadStats();

  setText("dash-conversations-num", String(totalConversations));
  setText("dash-conversations-label", t("dashConversations"));
  setText("dash-questions-num", String(totalQuestions));
  setText("dash-questions-label", t("dashQuestions"));
  setText(
    "dash-lastactive-num",
    stats.lastActive ? new Date(stats.lastActive).toLocaleString(State.lang === "ar" ? "ar-EG" : "en-US") : "—"
  );
  setText("dash-lastactive-label", t("dashLastActive"));

  setText("dash-route-title", t("dashRouteTitle"));
  setText("dash-lang-title", t("dashLangTitle"));

  const rc = stats.routeCounts;
  const maxRoute = Math.max(rc.guidelines, rc.arabic, rc.both, 1);
  setBar("bar-route-guidelines", "dash-route-guidelines-label", t("dashRouteGuidelines"), rc.guidelines, maxRoute);
  setBar("bar-route-arabic", "dash-route-arabic-label", t("dashRouteArabic"), rc.arabic, maxRoute);
  setBar("bar-route-both", "dash-route-both-label", t("dashRouteBoth"), rc.both, maxRoute);

  const lc = stats.langCounts;
  const maxLang = Math.max(lc.ar, lc.en, 1);
  setBar("bar-lang-ar", "dash-lang-ar-label", t("dashLangAr"), lc.ar, maxLang, "amber");
  setBar("bar-lang-en", "dash-lang-en-label", t("dashLangEn"), lc.en, maxLang, "amber");

  const emptyNote = document.getElementById("dash-empty");
  if (emptyNote) {
    emptyNote.textContent = t("dashEmpty");
    emptyNote.style.display = totalQuestions === 0 ? "block" : "none";
  }
}

/* ==========================================================================
   7. Init
   ========================================================================== */
function init() {
  loadConversations();
  applyTheme();
  applyLanguage();
  renderLandingPage();

  const onThemeToggle = () => toggleTheme();
  if (el.themeToggle) el.themeToggle.addEventListener("click", onThemeToggle);
  if (el.headerThemeBtn) el.headerThemeBtn.addEventListener("click", onThemeToggle);
  if (el.topnavThemeBtn) el.topnavThemeBtn.addEventListener("click", onThemeToggle);

  el.newChatBtn.addEventListener("click", () => {
    State.activeId = null;
    renderConversation();
    closeMobileSidebar();
    showView("app");
  });

  el.langButtons.forEach((btn) => {
    btn.addEventListener("click", () => {
      State.lang = btn.dataset.lang;
      applyLanguage();
      renderLandingPage();
      if (document.getElementById("view-dashboard").classList.contains("active")) renderDashboard();
    });
  });

  el.aboutLink.addEventListener("click", goToAbout);
  el.aboutBtnHeader.addEventListener("click", goToAbout);

  // Delegated so it keeps working after renderLandingPage() re-creates the hero markup.
  document.addEventListener("click", (e) => {
    const navGoBtn = e.target.closest("[data-nav-go]");
    if (navGoBtn) { showView(navGoBtn.dataset.navGo); return; }
    const scrollBtn = e.target.closest("[data-scroll-to]");
    if (scrollBtn) {
      document.getElementById(scrollBtn.dataset.scrollTo)?.scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }
    const navLinkBtn = e.target.closest(".topnav-links button[data-nav]");
    if (navLinkBtn) { showView(navLinkBtn.dataset.nav); }
  });

  el.mobileMenuBtn.addEventListener("click", openMobileSidebar);
  el.scrim.addEventListener("click", closeMobileSidebar);

  el.textarea.addEventListener("input", autoResizeTextarea);
  el.textarea.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });
  el.sendBtn.addEventListener("click", handleSend);

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && el.sidebar.classList.contains("open")) closeMobileSidebar();
  });

  Api.checkHealth().then(updateStatusPill);
  setInterval(() => Api.checkHealth().then(updateStatusPill), 30000);

  showView("landing");
}

document.addEventListener("DOMContentLoaded", init);

</script>
